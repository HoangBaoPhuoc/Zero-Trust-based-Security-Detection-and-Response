version: '3.8'
services:
  api-gateway:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports: ["8080:8080"]
  payment-service:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: payment-service
  ai-analyzer:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ai-analyzer
      network: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8090:8080"]
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SOAR_WEBHOOK_URL: ${SOAR_WEBHOOK_URL:-http://soar-engine:8080/alerts}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
  soar-engine:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: soar-engine
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8091:8080"]
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SOAR_DRY_RUN: ${SOAR_DRY_RUN:-true}
      SOAR_AUTO_EXECUTE: ${SOAR_AUTO_EXECUTE:-true}
      SOAR_MIN_SEVERITY: ${SOAR_MIN_SEVERITY:-high}
      SOAR_MIN_CONFIDENCE: ${SOAR_MIN_CONFIDENCE:-0.70}
      SOAR_API_TOKEN: ${SOAR_API_TOKEN:-}
      SOAR_CASE_STORE_PATH: ${SOAR_CASE_STORE_PATH:-/data/cases.jsonl}
    volumes:
      - soar-data:/data

volumes:
  soar-data:
