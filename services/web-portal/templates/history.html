{% extends "_app_shell.html" %}
{% block title %}Lịch sử giao dịch — ZTLab Bank{% endblock %}
{% block page_title %}Lịch sử giao dịch{% endblock %}

{% block content %}
<div class="card" style="margin-bottom:12px;padding:14px">
  <div class="form-group" style="margin-bottom:10px">
    <input type="text" id="f-search" class="form-input" placeholder="Tìm theo số tài khoản đối tác...">
  </div>
  <select id="f-direction" class="form-input">
    <option value="">Tất cả chiều</option>
    <option value="out">Đã gửi</option>
    <option value="in">Đã nhận</option>
  </select>
</div>

<div id="hist-container">
  <div class="loading" style="padding:20px"><div class="spinner"></div> Đang tải...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const myAccountId = {{ account_id | tojson }};
let allTxns = [];

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtVND(n) { return parseFloat(n).toLocaleString('vi-VN') + ' ₫'; }
function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function applyFilters() {
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  const direction = document.getElementById('f-direction').value;

  let rows = allTxns.filter(t => {
    const isOut = t.from_account === myAccountId;
    if (direction === 'out' && !isOut) return false;
    if (direction === 'in' && isOut) return false;
    if (search) {
      const partner = (isOut ? t.to_account : t.from_account || '').toLowerCase();
      if (!partner.includes(search)) return false;
    }
    return true;
  });

  const container = document.getElementById('hist-container');
  if (!rows.length) {
    container.innerHTML = '<div class="card" style="text-align:center;color:var(--text3);font-size:13px;padding:30px">Không có giao dịch phù hợp</div>';
    return;
  }
  container.innerHTML = rows.map(t => {
    const isOut = t.from_account === myAccountId;
    const sign = isOut ? '−' : '+';
    const cls = isOut ? 'amount-negative' : 'amount-positive';
    const partner = esc(isOut ? t.to_account : t.from_account);
    const statusBadge = t.status === 'completed'
      ? '<span class="badge badge-green">Hoàn thành</span>'
      : `<span class="badge badge-yellow">${esc(t.status)}</span>`;
    return `<div class="card" style="margin-bottom:8px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div style="font-size:13px;font-weight:700">${isOut ? '↑ Chuyển đi' : '↓ Nhận về'}</div>
        <div class="${cls}" style="font-size:14px">${sign}${fmtVND(t.amount)}</div>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Đối tác: <span class="mono">${partner}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--text3)">${esc(fmtDate(t.created_at||0))}</span>
        ${statusBadge}
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px" class="mono">Trace: ${esc((t.trace_id||'').slice(0,16) || '—')}</div>
    </div>`;
  }).join('');
}

async function load() {
  if (!myAccountId) {
    document.getElementById('hist-container').innerHTML = '<div class="card" style="text-align:center;color:var(--text3);font-size:13px;padding:30px">Chưa có tài khoản</div>';
    return;
  }
  try {
    const rt = await fetch(`/api/transactions?account_id=${encodeURIComponent(myAccountId)}&limit=100`);
    let txns = await rt.json();
    if (!Array.isArray(txns)) txns = [];
    txns.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
    allTxns = txns;
    applyFilters();
  } catch(e) {
    document.getElementById('hist-container').innerHTML = '<div class="alert alert-error">Lỗi kết nối dịch vụ</div>';
  }
}

document.getElementById('f-search').addEventListener('input', applyFilters);
document.getElementById('f-direction').addEventListener('change', applyFilters);
load();
</script>
{% endblock %}
