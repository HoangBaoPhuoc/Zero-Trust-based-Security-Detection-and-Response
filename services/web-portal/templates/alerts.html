{% extends "base.html" %}
{% block title %}AI Security Alerts — ZTLab{% endblock %}
{% block page_title %}AI Security Alerts{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
  <button class="btn btn-primary" onclick="loadAlerts('pending')">🔄 Làm mới</button>
  <button class="btn" onclick="loadAlerts('pending')" id="tab-pending">Chờ duyệt</button>
  <button class="btn" onclick="loadAlerts('approved')" id="tab-approved">Đã duyệt</button>
  <button class="btn" onclick="loadAlerts('dismissed')" id="tab-dismissed">Đã từ chối</button>
  <span style="font-size:12px;color:var(--muted)" id="alert-count"></span>
</div>

<div id="info-box" style="display:none"></div>

<div id="alerts-list"><div class="loading">Đang tải...</div></div>
{% endblock %}

{% block scripts %}
<script>
let currentStatus = 'pending';

const SEV_BADGE = {
  critical: '<span class="badge badge-red">CRITICAL</span>',
  high: '<span class="badge badge-yellow">HIGH</span>',
  medium: '<span class="badge" style="background:rgba(88,166,255,.15);color:#58a6ff;border-color:rgba(88,166,255,.3)">MEDIUM</span>',
  low: '<span class="badge">LOW</span>',
};

async function loadAlerts(status) {
  currentStatus = status;
  ['pending','approved','dismissed'].forEach(s => {
    const el = document.getElementById('tab-' + s);
    if (el) el.style.borderColor = s === status ? 'var(--accent)' : 'var(--border)';
    if (el) el.style.color = s === status ? 'var(--accent)' : 'var(--muted)';
  });
  document.getElementById('alerts-list').innerHTML = '<div class="loading">Đang tải...</div>';
  document.getElementById('info-box').style.display = 'none';
  try {
    const r = await fetch('/api/alerts?status=' + status);
    const alerts = await r.json();
    if (!Array.isArray(alerts) || alerts.length === 0) {
      document.getElementById('alerts-list').innerHTML = '<div class="card"><p style="color:var(--muted);font-size:13px">Không có alert nào.</p></div>';
      document.getElementById('alert-count').textContent = '0 alerts';
      return;
    }
    document.getElementById('alert-count').textContent = alerts.length + ' alerts';
    const html = alerts.map(a => {
      const sev = (a.alert.severity || 'medium').toLowerCase();
      const badge = SEV_BADGE[sev] || SEV_BADGE.medium;
      const created = a.created_at ? new Date(a.created_at).toLocaleString('vi-VN') : '';
      const expires = a.expires_at ? new Date(a.expires_at).toLocaleString('vi-VN') : '';
      const evidence = (a.alert.evidence || []).slice(0,2).map(e =>
        `<div class="mono" style="font-size:11px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border)">${e.substring(0,200)}</div>`
      ).join('');
      const actionBtns = a.status === 'pending' ? `
        <button class="btn btn-green" onclick="approveAlert('${a.alert_id}')">✅ Approve → SOAR</button>
        <button class="btn btn-red" onclick="dismissAlert('${a.alert_id}')">❌ Dismiss</button>
      ` : `<span class="badge ${a.status === 'approved' ? 'badge-green' : ''}">${a.status.toUpperCase()}</span>`;
      const theHiveMeta = (a.thehive_alert_id || a.thehive_case_id) ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px">
          ${a.thehive_alert_id ? `<span class="mono">TheHive alert: ${a.thehive_alert_id}</span>` : ''}
          ${a.thehive_case_id ? `<span class="mono">TheHive case: ${a.thehive_case_id}</span>` : ''}
        </div>` : '';

      return `<div class="card" id="alert-${a.alert_id}" style="border-left:3px solid ${sev === 'critical' ? 'var(--red)' : sev === 'high' ? 'var(--orange)' : 'var(--yellow)'}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
          <div>
            ${badge}
            <span style="font-size:13px;font-weight:600;margin-left:8px">${a.alert.attack_type}</span>
          </div>
          <span class="mono" style="font-size:11px;color:var(--muted)">${a.alert_id}</span>
        </div>
        <p style="font-size:13px;margin-bottom:10px">${a.alert.summary}</p>
        <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:10px">
          <span>🎯 ${a.alert.affected_service || '—'}</span>
          <span>🌐 ${a.alert.source_ip || '—'}</span>
          <span>📊 Confidence: ${(a.alert.confidence * 100).toFixed(0)}%</span>
          <span>🕐 ${created}</span>
          ${a.status === 'pending' ? `<span style="color:var(--yellow)">⏰ Hết hạn: ${expires}</span>` : ''}
        </div>
        ${evidence ? `<div style="background:var(--bg);border-radius:4px;padding:8px;margin-bottom:10px">${evidence}</div>` : ''}
        ${theHiveMeta}
        ${a.note ? `<p style="font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px">Ghi chú: ${a.note}</p>` : ''}
        <div style="display:flex;gap:8px">${actionBtns}</div>
      </div>`;
    }).join('');
    document.getElementById('alerts-list').innerHTML = html;
  } catch(e) {
    document.getElementById('alerts-list').innerHTML = '<div class="alert alert-error">Lỗi: ' + e.message + '</div>';
  }
}

async function approveAlert(alertId) {
  const note = prompt('Ghi chú khi duyệt (tùy chọn):') || 'Đã xác minh bởi admin';
  const r = await fetch('/api/alerts/' + alertId + '/approve', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ note })
  });
  const d = await r.json();
  const infoBox = document.getElementById('info-box');
  infoBox.style.display = 'block';
  if (r.ok) {
    infoBox.className = 'alert alert-success';
    infoBox.innerHTML = '✅ Đã duyệt và gửi tới SOAR. Alert ID: ' + alertId;
    setTimeout(() => loadAlerts(currentStatus), 1000);
  } else {
    infoBox.className = 'alert alert-error';
    infoBox.textContent = 'Lỗi: ' + (d.detail || d.error || JSON.stringify(d));
  }
}

async function dismissAlert(alertId) {
  const note = prompt('Lý do từ chối:') || 'Không phải mối đe dọa thực sự';
  const r = await fetch('/api/alerts/' + alertId + '/dismiss', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ note })
  });
  if (r.ok) {
    document.getElementById('info-box').style.display = 'block';
    document.getElementById('info-box').className = 'alert alert-success';
    document.getElementById('info-box').textContent = '✓ Đã từ chối alert ' + alertId;
    setTimeout(() => loadAlerts(currentStatus), 1000);
  }
}

loadAlerts('pending');
setInterval(() => { if (currentStatus === 'pending') loadAlerts('pending'); }, 30000);
</script>
{% endblock %}
