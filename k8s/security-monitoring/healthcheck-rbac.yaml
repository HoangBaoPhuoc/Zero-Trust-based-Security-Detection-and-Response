apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-healthcheck
  namespace: spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-healthcheck
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-healthcheck
  namespace: spire
subjects:
  - kind: ServiceAccount
    name: security-healthcheck
    namespace: spire
roleRef:
  kind: Role
  name: security-healthcheck
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-healthcheck-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-healthcheck-nodes
subjects:
  - kind: ServiceAccount
    name: security-healthcheck
    namespace: spire
roleRef:
  kind: ClusterRole
  name: security-healthcheck-nodes
  apiGroup: rbac.authorization.k8s.io
