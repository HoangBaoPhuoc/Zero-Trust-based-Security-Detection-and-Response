apiVersion: v1
kind: Namespace
metadata:
  name: crapi
  labels:
    app.kubernetes.io/part-of: ztlab
    app.kubernetes.io/managed-by: kubectl
    # Istio sidecar injection — bật ở deploy_istio() (kaws/kos label --overwrite),
    # để sẵn label ở đây cho lần apply đầu.
    istio-injection: enabled
