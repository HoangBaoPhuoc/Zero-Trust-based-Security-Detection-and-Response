# Traefik IngressRoute — điểm vào duy nhất của crAPI qua bff.
# Access qua SSH tunnel: curl -H 'Host: crapi.ztlab.local' http://localhost:8080/
# mailhog UI (xem hộp thư OTP): Host mailhog.ztlab.local
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crapi-bff
  namespace: crapi
spec:
  entryPoints: [web]
  routes:
    - match: Host(`crapi.ztlab.local`)
      kind: Rule
      services:
        - name: bff
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crapi-mailhog
  namespace: crapi
spec:
  entryPoints: [web]
  routes:
    - match: Host(`mailhog.ztlab.local`)
      kind: Rule
      services:
        - name: mailhog
          port: 8025
