---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-crapi-allow-baseline
  namespace: crapi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Traefik (kube-system) -> waf :8080 (bien CU, giu song song toi khi bien MOI verify xong - Phan 1.3)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # Istio IngressGateway (istio-system) -> waf :8080 (bien MOI, Phan 1.3) - xac nhan song 2026-09-13: thieu rule nay lam ECONNREFUSED tu gateway pod, kube-router THAT SU enforce netpol namespace-scoped cho traffic nay (khac mo ta chung 'khong enforce cho sidecar' trong tai lieu - do la ve L7/rule khac, khong phai default-deny theo namespace)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
        - { port: 8181, protocol: TCP }
    # security-healthcheck CronJob -> opa :8181
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: spire }
      ports:
        - { port: 8181, protocol: TCP }
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # noi bo crapi (app + DB + opa + mTLS)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
      ports:
        - { port: 80, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 8000, protocol: TCP }
        - { port: 8080, protocol: TCP }
        - { port: 8087, protocol: TCP }
        - { port: 8181, protocol: TCP }
        - { port: 9191, protocol: TCP }
        - { port: 15006, protocol: TCP }
        - { port: 27017, protocol: TCP }
    # bff audit -> Loki
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: plg-stack }
      ports:
        - { port: 3100, protocol: TCP }
    # istio-proxy -> istiod (CA + xDS)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 15012, protocol: TCP }
    # cross-cloud -> openstack (aws/bff->openstack/crapi-identity, aws/bff->openstack/keycloak, aws/crapi-community->openstack/crapi-identity, aws/crapi-community->openstack/postgresdb, aws/crapi-workshop->openstack/crapi-identity, aws/crapi-workshop->openstack/postgresdb, aws/opa->openstack/keycloak)
    - to:
        - ipBlock: { cidr: 192.168.101.0/24 }
      ports:
        - { port: 30090, protocol: TCP }
        - { port: 30091, protocol: TCP }
        - { port: 30432, protocol: TCP }
