# NetworkPolicy L4 baseline — ns crapi, cluster AWS. Mẫu
# k8s/financial/network-policies/aws-allow-list.yaml.
#
# LƯU Ý (như finance): k3s embedded netpol controller KHÔNG enforce đầy đủ cho
# traffic đi qua Istio sidecar trên hạ tầng này — lớp phân đoạn THẬT đang chạy
# là L7 (opa/crapi-policies/service_acl). File này đúng về khai báo/ý định +
# enforce được cho path không-sidecar (opa:8181, DNS, cross-cloud ipBlock).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-crapi-allow-baseline
  namespace: crapi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Traefik (kube-system) → bff :8080
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # Prometheus (monitoring) scrape
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
        - { port: 8181, protocol: TCP }
    # security-healthcheck CronJob (spire ns) → opa :8181
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: spire }
      ports:
        - { port: 8181, protocol: TCP }
    # nội bộ ns crapi (podSelector {} nghĩa là bất kỳ pod crapi → pod crapi)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # nội bộ crapi (8087/8000/80 app, 5432/27017/6379 DB, 9191/8181 opa, 15006 mТLS)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
      ports:
        - { port: 80, protocol: TCP }
        - { port: 8000, protocol: TCP }
        - { port: 8087, protocol: TCP }
        - { port: 8181, protocol: TCP }
        - { port: 9191, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 27017, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # bff → Keycloak (identity ns) :8080
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: identity }
      ports:
        - { port: 8080, protocol: TCP }
    # bff audit + (tương lai) log → Loki (plg-stack) :3100
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: plg-stack }
      ports:
        - { port: 3100, protocol: TCP }
    # Cross-cloud: AWS crapi → OpenStack NodePort qua WireGuard
    #   30090 = crapi-identity, 30432 = postgresdb
    - to:
        - ipBlock: { cidr: 192.168.101.0/24 }
      ports:
        - { port: 30090, protocol: TCP }
        - { port: 30432, protocol: TCP }
    # istio-proxy sidecar → istiod (CA + xDS) :15012
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 15012, protocol: TCP }
