# GENERATED FILE — KHÔNG SỬA TAY. Nguồn: policy/service-graph-crapi.yaml
# (netpol_baseline: + edge cross_cluster). Sinh lại: python3 scripts/gen-networkpolicy.py
#
# 2 phần: (1) hạ tầng thuần (Traefik/Prometheus/healthcheck/DNS/istiod/Loki) —
# khai tĩnh trong netpol_baseline: của service-graph, không phải edge service-
# to-service. (2) ipBlock cross-cloud — TÍNH RA từ mọi edge cross_cluster: true
# (gộp l4_ports theo cặp cluster nguồn->đích) để không còn trôi khi một
# workload đổi cloud (đúng bug đã xảy ra với Keycloak ở A1).
#
# LƯU Ý (như pod-segmentation): NetworkPolicy này hiện KHÔNG được kube-router
# enforce cho traffic có Istio sidecar trên hạ tầng đang dùng — L7 (OPA
# service_acl) là lớp phân đoạn thật. File này đúng về khai báo/ý định + có
# hiệu lực cho path không-sidecar (opa:8181, DNS, cross-cloud ipBlock).

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-crapi-allow-baseline
  namespace: crapi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Traefik (kube-system) -> waf :8080 (bien CU, giu song song toi khi bien MOI verify xong - Phan 1.3)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # Istio IngressGateway (istio-system) -> waf :8080 (bien MOI, Phan 1.3) - xac nhan song 2026-09-13: thieu rule nay lam ECONNREFUSED tu gateway pod, kube-router THAT SU enforce netpol namespace-scoped cho traffic nay (khac mo ta chung 'khong enforce cho sidecar' trong tai lieu - do la ve L7/rule khac, khong phai default-deny theo namespace)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
        - { port: 8181, protocol: TCP }
    # security-healthcheck CronJob -> opa :8181
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: spire }
      ports:
        - { port: 8181, protocol: TCP }
    # noi bo ns crapi (podSelector {} nen bat ky pod crapi -> pod crapi)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # noi bo crapi (app + DB + opa + mTLS)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
      ports:
        - { port: 80, protocol: TCP }
        - { port: 8000, protocol: TCP }
        - { port: 8087, protocol: TCP }
        - { port: 8181, protocol: TCP }
        - { port: 9191, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 27017, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # bff audit -> Loki
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: plg-stack }
      ports:
        - { port: 3100, protocol: TCP }
    # istio-proxy -> istiod (CA + xDS)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 15012, protocol: TCP }
    # cross-cloud -> openstack (aws/bff->openstack/crapi-identity, aws/bff->openstack/keycloak, aws/crapi-community->openstack/crapi-identity, aws/crapi-community->openstack/postgresdb, aws/crapi-workshop->openstack/crapi-identity, aws/crapi-workshop->openstack/postgresdb, aws/opa->openstack/keycloak)
    - to:
        - ipBlock: { cidr: 192.168.101.0/24 }
      ports:
        - { port: 30090, protocol: TCP }
        - { port: 30091, protocol: TCP }
        - { port: 30432, protocol: TCP }
