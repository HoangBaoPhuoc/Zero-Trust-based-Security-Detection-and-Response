# GENERATED FILE — KHÔNG SỬA TAY. Nguồn: policy/service-graph-crapi.yaml
# (netpol_baseline: + edge cross_cluster). Sinh lại: python3 scripts/gen-networkpolicy.py
#
# 2 phần: (1) hạ tầng thuần (Traefik/Prometheus/healthcheck/DNS/istiod/Loki) —
# khai tĩnh trong netpol_baseline: của service-graph, không phải edge service-
# to-service. (2) ipBlock cross-cloud — TÍNH RA từ mọi edge cross_cluster: true
# (gộp l4_ports theo cặp cluster nguồn->đích) để không còn trôi khi một
# workload đổi cloud (đúng bug đã xảy ra với Keycloak ở A1).
#
# LƯU Ý (như pod-segmentation): NetworkPolicy này hiện KHÔNG được kube-router
# enforce cho traffic có Istio sidecar trên hạ tầng đang dùng — L7 (OPA
# service_acl) là lớp phân đoạn thật. File này đúng về khai báo/ý định + có
# hiệu lực cho path không-sidecar (opa:8181, DNS, cross-cloud ipBlock).

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: os-crapi-allow-baseline
  namespace: crapi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # cross-cloud AWS k3s nodes + pod CIDR -> identity/postgres NodePort
    - from:
        - ipBlock: { cidr: 10.10.1.0/24 }
        - ipBlock: { cidr: 10.10.0.0/24 }
        - ipBlock: { cidr: 10.200.0.0/24 }
        - ipBlock: { cidr: 10.42.0.0/16 }
        - ipBlock: { cidr: 192.168.101.0/24 }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 5432, protocol: TCP }
        - { port: 15006, protocol: TCP }
        - { port: 8181, protocol: TCP }
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # security-healthcheck -> opa
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: spire }
      ports:
        - { port: 8181, protocol: TCP }
    # noi bo ns crapi
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # identity -> postgresdb/mailhog/opa noi bo
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: crapi }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 1025, protocol: TCP }
        - { port: 8025, protocol: TCP }
        - { port: 8181, protocol: TCP }
        - { port: 9191, protocol: TCP }
        - { port: 15006, protocol: TCP }
    # istio-proxy -> istiod
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
      ports:
        - { port: 15012, protocol: TCP }
    # Loki relay bridge (deployer socat)
    - to:
        - ipBlock: { cidr: 10.10.10.1/32 }
        - ipBlock: { cidr: 172.10.10.1/32 }
      ports:
        - { port: 13099, protocol: TCP }
    # cross-cloud -> aws (openstack/crapi-identity->aws/mailhog)
    - to:
        - ipBlock: { cidr: 10.10.1.0/24 }
      ports:
        - { port: 31025, protocol: TCP }
