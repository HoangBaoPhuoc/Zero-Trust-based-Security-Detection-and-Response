---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: os-pod-opa
  namespace: crapi
spec:
  podSelector:
    matchLabels:
      app: opa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: crapi-identity
      ports:
        - port: 9191
          protocol: TCP
        - port: 8181
          protocol: TCP
