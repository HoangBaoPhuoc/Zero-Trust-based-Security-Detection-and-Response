# Traefik IngressRoute (cluster AWS) — điểm vào duy nhất của crAPI.
# A2: qua WAF (ModSecurity/CRS DetectionOnly) → bff. Trước A2 route thẳng tới bff.
# Access qua SSH tunnel: curl -H 'Host: crapi.ztlab.local' http://localhost:8080/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crapi-bff
  namespace: crapi
spec:
  entryPoints: [web]
  routes:
    - match: Host(`crapi.ztlab.local`)
      kind: Rule
      services:
        - name: waf
          port: 8080
