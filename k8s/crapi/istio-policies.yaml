# Istio mesh policy cho ns crapi — mẫu k8s/financial/istio-policies.yaml.
#
# PeerAuthentication (STRICT + PERMISSIVE cho điểm vào) + DestinationRule
# custom-SAN (bắt buộc: SPIRE cấp SPIFFE scheme riêng spiffe://ztlab.local/
# <cloud>/<svc>) + CUSTOM AuthorizationPolicy → opa-ext-authz-crapi (PHASE 3).
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: crapi
spec:
  mtls:
    mode: STRICT
---
# crapi-web: nhận traffic từ bff (in-mesh, Phase 2) và — trong Phase 1 —
# từ kubectl port-forward khi test. PERMISSIVE để cả 2 chạy được.
# Phase 2: giữ PERMISSIVE (bff vẫn gọi qua, và đây không phải điểm enforce authz).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: crapi-web-permissive
  namespace: crapi
spec:
  selector:
    matchLabels: { app: crapi-web }
  mtls:
    mode: PERMISSIVE
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: crapi-web-custom-san
  namespace: crapi
spec:
  host: crapi-web.crapi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames: ["spiffe://ztlab.local/aws/crapi-web"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: crapi-community-custom-san
  namespace: crapi
spec:
  host: crapi-community.crapi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames: ["spiffe://ztlab.local/aws/crapi-community"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: crapi-workshop-custom-san
  namespace: crapi
spec:
  host: crapi-workshop.crapi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames: ["spiffe://ztlab.local/aws/crapi-workshop"]
---
# ══ PHASE 3: CUSTOM AuthorizationPolicy → OPA ext_authz ══
# fail-closed (Istio deny nếu ext_authz không tới được, trừ khi failOpen).
# Provider `opa-ext-authz-crapi` → opa-service.crapi:9191 (istio-operator.yaml).
# Selector không match trên cluster không chạy workload đó → cùng file apply
# được cho cả 2 cluster.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: bff-opa-authz
  namespace: crapi
spec:
  selector:
    matchLabels: { app: bff }
  action: CUSTOM
  provider: { name: opa-ext-authz-crapi }
  rules: [ {} ]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: crapi-community-opa-authz
  namespace: crapi
spec:
  selector:
    matchLabels: { app: crapi-community }
  action: CUSTOM
  provider: { name: opa-ext-authz-crapi }
  rules: [ {} ]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: crapi-workshop-opa-authz
  namespace: crapi
spec:
  selector:
    matchLabels: { app: crapi-workshop }
  action: CUSTOM
  provider: { name: opa-ext-authz-crapi }
  rules: [ {} ]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: crapi-identity-opa-authz
  namespace: crapi
spec:
  selector:
    matchLabels: { app: crapi-identity }
  action: CUSTOM
  provider: { name: opa-ext-authz-crapi }
  rules: [ {} ]
