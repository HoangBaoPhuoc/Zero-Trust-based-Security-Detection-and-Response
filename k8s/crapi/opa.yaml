# OPA PDP riêng cho crAPI (ns crapi) — tách hẳn OPA của finance app (Phase 5
# xoá finance thì OPA này thành DUY NHẤT). 3 replica + PDB (fail-closed F10,
# như os-security.yaml của finance).
#
# ConfigMap tạo bởi scripts/deploy-crapi.sh (deploy_crapi_opa):
#   - opa-config       : per-cluster (path zta/crapi/authz/allow [AWS] hoặc
#                        zta/crapi/crosscloud/allow [OpenStack])
#   - opa-policies-crapi: --from-file=opa/crapi-policies/  (chung 2 cluster)
#
# Istio gọi qua extensionProvider `opa-ext-authz-crapi` (k8s/istio/istio-operator.yaml)
# → opa-service.crapi.svc.cluster.local:9191. REST 8181 cho health/decision-log.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: opa, namespace: crapi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server
  namespace: crapi
  labels: { app: opa }
spec:
  replicas: 3
  selector:
    matchLabels: { app: opa }
  template:
    metadata:
      labels: { app: opa }
      annotations:
        # Phần 1.2 (remediation 2026-09, BẪY 2 KEHOACH-THAYDOI-HETHONG.md):
        # opa-server AWS gọi Keycloak (JWKS + OIDC discovery, http.send) —
        # hop này giờ cần SVID thật (opa/crapi-policies/crosscloud_crapi.rego
        # "Keycloak guard" kiểm valid_svid). Bật sidecar để CÓ danh tính cho
        # EGRESS này. Không đặt spiffe.io/spiffeid cố định ở đây (khác
        # bff/waf) vì file này DÙNG CHUNG cho cả 2 cluster — SPIFFE ID khác
        # nhau (aws/opa vs openstack/opa) tuỳ context áp; SPIRE match theo
        # k8s:ns/k8s:sa selector (scripts/ensure-spire-entries.sh), không
        # phải theo annotation này (annotation ở bff/waf chỉ có giá trị tài
        # liệu hoá, không có tác dụng chức năng — verify sống Phần 1.3).
        # opa-service-plaintext DestinationRule + PeerAuthentication PERMISSIVE
        # dưới đây GIỮ NGUYÊN hành vi INBOUND (mọi caller ext_authz hiện tại
        # vẫn plaintext, không phá vỡ chuỗi PDP đang chạy) — chỉ EGRESS của
        # opa (tới Keycloak, DestinationRule riêng phía AWS) mới đổi sang mТLS.
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          image: openpolicyagent/opa@sha256:1792991ca9646526b8c95c59cbb525ce33bf78458800182d78f6fa884d5ec517
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/opa-config.yaml"
            - "--ignore=.*"
            - "/policies"
          ports:
            - { name: http, containerPort: 8181 }
            - { name: grpc-authz, containerPort: 9191 }
          volumeMounts:
            - { name: opa-config, mountPath: /etc/opa, readOnly: true }
            - { name: opa-policies, mountPath: /policies, readOnly: true }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: opa-config
          configMap: { name: opa-config }
        - name: opa-policies
          configMap: { name: opa-policies-crapi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opa-server
  namespace: crapi
  labels: { app: opa }
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: opa }
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: crapi
  labels: { app: opa }
spec:
  type: ClusterIP
  selector: { app: opa }
  ports:
    - { name: http, port: 8181, targetPort: 8181 }
    - { name: grpc-authz, port: 9191, targetPort: 9191 }
---
# opa-service KHÔNG chấp nhận mТLS ở chiều INBOUND (client istio-proxy phải
# đi plaintext tới nó, như trước Phần 1.2) — chỉ EGRESS của opa (Phần 1.2,
# tới Keycloak) mới có SVID thật.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: opa-service-plaintext
  namespace: crapi
spec:
  host: opa-service.crapi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
---
# Phần 1.2: opa-server nay có sidecar (egress tới Keycloak) nhưng INBOUND
# (ext_authz gRPC/HTTP từ bff/waf/crapi-web/community/workshop/identity) phải
# GIỮ NGUYÊN plaintext — nếu không override, ns default STRICT sẽ áp cho
# opa's inbound và làm gãy toàn bộ PDP (mọi caller đang cấu hình DestinationRule
# DISABLE cho host này, gửi plaintext, sẽ bị STRICT từ chối → fail-closed 503
# toàn hệ thống). PERMISSIVE ở đây chấp nhận CẢ plaintext (mọi caller hiện tại,
# không đổi) lẫn mТLS (nếu tương lai có caller khác chọn mã hoá hop này).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: opa-permissive
  namespace: crapi
spec:
  selector:
    matchLabels: { app: opa }
  mtls:
    mode: PERMISSIVE
