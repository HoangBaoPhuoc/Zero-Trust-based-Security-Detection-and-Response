# OPA PDP riêng cho crAPI (ns crapi) — tách hẳn OPA của finance app (Phase 5
# xoá finance thì OPA này thành DUY NHẤT). 3 replica + PDB (fail-closed F10,
# như os-security.yaml của finance).
#
# ConfigMap tạo bởi scripts/deploy-crapi.sh (deploy_crapi_opa):
#   - opa-config       : per-cluster (path zta/crapi/authz/allow [AWS] hoặc
#                        zta/crapi/crosscloud/allow [OpenStack])
#   - opa-policies-crapi: --from-file=opa/crapi-policies/  (chung 2 cluster)
#
# Istio gọi qua extensionProvider `opa-ext-authz-crapi` (k8s/istio/istio-operator.yaml)
# → opa-service.crapi.svc.cluster.local:9191. REST 8181 cho health/decision-log.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: opa, namespace: crapi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server
  namespace: crapi
  labels: { app: opa }
spec:
  replicas: 3
  selector:
    matchLabels: { app: opa }
  template:
    metadata:
      labels: { app: opa }
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          image: openpolicyagent/opa@sha256:1792991ca9646526b8c95c59cbb525ce33bf78458800182d78f6fa884d5ec517
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/opa-config.yaml"
            - "--ignore=.*"
            - "/policies"
          ports:
            - { name: http, containerPort: 8181 }
            - { name: grpc-authz, containerPort: 9191 }
          volumeMounts:
            - { name: opa-config, mountPath: /etc/opa, readOnly: true }
            - { name: opa-policies, mountPath: /policies, readOnly: true }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: opa-config
          configMap: { name: opa-config }
        - name: opa-policies
          configMap: { name: opa-policies-crapi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opa-server
  namespace: crapi
  labels: { app: opa }
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: opa }
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: crapi
  labels: { app: opa }
spec:
  type: ClusterIP
  selector: { app: opa }
  ports:
    - { name: http, port: 8181, targetPort: 8181 }
    - { name: grpc-authz, port: 9191, targetPort: 9191 }
---
# opa-service không có sidecar → client istio-proxy phải đi plaintext tới nó
# (như opa-service-plaintext của finance).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: opa-service-plaintext
  namespace: crapi
spec:
  host: opa-service.crapi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
