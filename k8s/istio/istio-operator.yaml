# IstioOperator config — single source of truth for `istioctl install`
# (scripts/deploy-app.sh's deploy_istio() applies this file, not ad-hoc
# --set flags, so trustDomain + the OPA extension provider survive redeploy
# and stay reviewable in one place).
#
# extensionProviders.opa-ext-authz replicates the hand-rolled Envoy's
# ext_authz filter (envoy/configmap.yaml, cluster opa_ext_authz,
# failure_mode_allow: false) for every service migrated off that sidecar —
# see the CUSTOM AuthorizationPolicy entries in
# k8s/financial/istio-policies.yaml that reference this provider by name.
# Without this, a migrated service loses its OPA/Rego enforcement entirely
# (JWT role checks, fraud-gate header, device posture, IP-block list) and
# falls back to whatever plain ALLOW/DENY rules the AuthorizationPolicy
# itself expresses — fine for notification-service (OPA's rule there is just
# "valid SPIRE identity", a native Istio principal check), NOT fine for
# api-gateway/payment-service/fraud-detection (real Rego logic with no
# native Istio equivalent).
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: minimal
  meshConfig:
    trustDomain: ztlab.local
    # Istio has NO access logging by default. Before this, removing the
    # hand-rolled Envoy sidecar silently broke the detection layer: 2 of 6
    # Grafana alert rules (brute-force-alert.yml, large-response-alert.yml)
    # query {job="envoy-access", ...} in Loki, a label Promtail only ever
    # assigned to logs from a container literally named "envoy" — which no
    # longer exists on any of the 8 migrated services. The other 4 rules use
    # job="opa-decisions" (OPA's own decision log, unaffected — same OPA
    # instance, same ext_authz call shape via the CUSTOM provider) or
    # app-level JSON logs, so they kept passing in KB regression while these
    # two would never fire again. This format intentionally matches the old
    # hand-rolled Envoy's JSON field names (method/path/response_code/
    # response_time/upstream/source_ip/bytes_sent/trace_id/svid) so the
    # existing alert rules' LogQL keeps working unchanged — see the matching
    # Promtail scrape job rename in k8s/plg-stack/promtail-daemonset.yaml
    # (container_name regex "envoy" → "istio-proxy").
    # Mục 4 vòng 2026-09-29 (H2): +upstream_cluster ("inbound|..." hoặc
    # "outbound|..."/PassthroughCluster — phân biệt dòng log phía server với
    # phía client của cùng sidecar; `svid` = DOWNSTREAM_PEER_URI_SAN chỉ có
    # nghĩa ở phía inbound), +response_flags (NR = không filter chain nào khớp,
    # vd plaintext vào cổng STRICT) và +transport_failure (lý do bắt tay TLS
    # phía downstream thất bại). Promtail suy ra nhãn `direction` từ
    # upstream_cluster; rule mesh-integrity chỉ xét direction="inbound".
    # Giai đoạn B §1.3 (H6): +upstream_service_time (%RESP(X-ENVOY-UPSTREAM-
    # SERVICE-TIME)%) — thời gian UPSTREAM xử lý (ms), tách khỏi response_time
    # (%DURATION% = tổng vòng, gồm cả hàng đợi/đường về). Là mảnh còn thiếu của
    # phép đo độ trễ: thêm TRƯỚC đợt thu → có hàng triệu mẫu miễn phí suốt 150h,
    # không cần cửa sổ đo riêng. Thuần cộng thêm — field cũ giữ nguyên nên LogQL
    # của alert hiện hữu không đổi. Nằm trong BODY log JSON (Promtail không
    # promote thành nhãn — tránh cardinality, xem promtail-daemonset.yaml).
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON
    accessLogFormat: |
      {
        "timestamp": "%START_TIME%",
        "method": "%REQ(:METHOD)%",
        "path": "%REQ(:PATH)%",
        "response_code": "%RESPONSE_CODE%",
        "response_time": "%DURATION%",
        "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%",
        "upstream": "%UPSTREAM_HOST%",
        "source_ip": "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%",
        "bytes_sent": "%BYTES_SENT%",
        "trace_id": "%REQ(X-REQUEST-ID)%",
        "svid": "%DOWNSTREAM_PEER_URI_SAN%",
        "upstream_cluster": "%UPSTREAM_CLUSTER%",
        "response_flags": "%RESPONSE_FLAGS%",
        "transport_failure": "%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
      }
    extensionProviders:
      # OPA ext_authz cho crAPI (ns crapi). Path zta/crapi/authz/allow (AWS) /
      # zta/crapi/crosscloud/allow (OpenStack) — cấu hình ở configmap opa-config
      # mỗi cluster (scripts/deploy-crapi.sh).
      - name: opa-ext-authz
        envoyExtAuthzGrpc:
          service: opa-service.crapi.svc.cluster.local
          port: "9191"
  # Phần 1.3 (remediation 2026-09) — biên vào mesh thật (thay Traefik->waf,
  # hop chưa bao giờ có source_principal — xem KIEM-KE-HOP.md nhóm (c)-1).
  # Chỉ bật trên AWS (nơi crAPI expose ra ngoài); OpenStack không cần
  # ingressgateway crAPI. Service type ClusterIP — lab không có cloud LB,
  # truy cập qua kubectl port-forward giống mọi UI khác (scripts/open-admin-uis.sh),
  # cổng MỚI (8443) độc lập với Traefik :18443 hiện có (chạy song song, xem A3
  # cũ + Phần 1.3 mới trong KEHOACH-THAYDOI-HETHONG.md — không tháo đường cũ
  # trước khi đường mới verify xong cả 3 kịch bản cert).
  components:
    ingressGateways:
      - name: istio-ingressgateway
        namespace: istio-system
        enabled: true
        label:
          app: istio-ingressgateway
          istio: ingressgateway
        k8s:
          service:
            type: ClusterIP
            ports:
              - name: https-device-mtls
                port: 8443
                targetPort: 8443
          # Gateway pod nhận SPIFFE thật từ SPIRE, giống mọi workload khác
          # (bff/waf) — nhưng KHÔNG đi qua sidecar-injection webhook (gateway
          # pod render trực tiếp từ chart ingressGateways, không phải pod app
          # được inject) nên `sidecar.istio.io/userVolume` annotation (dùng
          # được cho bff/waf) KHÔNG có tác dụng ở đây — verify sống 2026-09-13:
          # thiếu overlay này, istio-proxy log "Workload SDS socket not found.
          # Starting Istio SDS Server" (rơi về cert tự ký của istiod, KHÔNG
          # phải SPIRE) dù có podAnnotations. Dùng k8s.overlays (strategic
          # patch vào chính Deployment) để mount đúng socket path.
          podAnnotations:
            spiffe.io/spiffeid: "spiffe://ztlab.local/aws/edge-gateway"
          overlays:
            - apiVersion: apps/v1
              kind: Deployment
              name: istio-ingressgateway
              patches:
                - path: spec.template.spec.volumes[100]
                  value:
                    name: spire-workload-socket
                    hostPath: { path: /run/spire/sockets/agent.sock, type: Socket }
                - path: spec.template.spec.containers.[name:istio-proxy].volumeMounts[100]
                  value:
                    name: spire-workload-socket
                    mountPath: /var/run/secrets/workload-spiffe-uds/socket
