apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: os-financial-allow-baseline
  namespace: financial
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Intra-cluster: OS services talk to each other
    # 15006=Envoy mTLS, 8080=app HTTP, 9191=OPA gRPC, 5432=postgres, 6379=redis
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: financial
      ports:
        - port: 15006
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 9191
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    # Cross-cloud: AWS K3s nodes and pod subnets (via MASQUERADE on workers)
    # 15006=Envoy mTLS inbound, 8080=plain HTTP (metrics, health checks)
    - from:
        - ipBlock:
            cidr: 10.10.1.0/24
        - ipBlock:
            cidr: 10.10.0.0/24
        - ipBlock:
            cidr: 10.200.200.0/24
        - ipBlock:
            cidr: 192.168.101.0/24
        # NodePort traffic forwarded cross-node (externalTrafficPolicy:
        # Cluster, the k8s default) gets SNAT'd by kube-proxy to the pod
        # network CIDR before crossing to the node that actually runs the
        # backend pod — standard, unavoidable k8s behavior, not specific to
        # this project. Without this rule, ANY cross-node NodePort call
        # (same-cluster same-subnet included, e.g. os-k3s-master calling a
        # pod on os-k3s-worker-2) gets refused by kube-router's netpol
        # enforcement, since the masqueraded source matches no other rule
        # here (confirmed via repro: host-namespace curl to another node's
        # pod IP failed identically to the cross-cloud case — this was never
        # actually cross-cloud-specific).
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 15006
          protocol: TCP
        - port: 8080
          protocol: TCP
    # Prometheus (monitoring namespace) scraping /metrics on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
        - port: 15006
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Intra-cluster: OS services talk to each other
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: financial
      ports:
        - port: 8080
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 9191
          protocol: TCP
        - port: 6379
          protocol: TCP
    # Loki push: deployer bridge (10.10.10.1:13099 → socat → kubectl pf → Loki on AWS)
    - to:
        - ipBlock:
            cidr: 10.10.10.1/32
      ports:
        - port: 13099
          protocol: TCP
    # SPIRE server on AWS (NodePort 30900 on master)
    - to:
        - ipBlock:
            cidr: 10.10.1.10/32
      ports:
        - port: 30900
          protocol: TCP
    # Istio (Phase 6, OpenStack) — istio-proxy sidecar needs istiod for CA
    # (cert signing) + xDS config, both served on 15012. Same fix as the AWS
    # side's plg-stack→vault NetworkPolicy gap: this must exist before any
    # pod with restricted egress starts, or its sidecar can't fetch its cert.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
