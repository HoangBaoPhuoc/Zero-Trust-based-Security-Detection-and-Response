---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-portal
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: financial
  labels:
    app: web-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/web-portal"
        sidecar.istio.io/inject: "false"  # not yet migrated to Istio, still hand-rolled Envoy — see migration plan
    spec:
      serviceAccountName: web-portal
      volumes:
        - name: patch-web-portal
          configMap:
            name: patch-web-portal
        - name: envoy-config
          configMap:
            name: envoy-config
            items:
              - key: envoy-sidecar.yaml
                path: envoy.yaml
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
      containers:
        - name: web-portal
          image: ztlab/web-portal:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLOUD_PROVIDER
              value: "aws"
            - name: API_GATEWAY_URL
              value: "http://api-gateway.financial.svc.cluster.local:8080"
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local:8080"
            - name: KEYCLOAK_PUBLIC_URL
              value: "http://keycloak.ztlab.local:8180"
            - name: KEYCLOAK_REALM
              value: "ztlab"
            - name: KEYCLOAK_CLIENT_ID
              value: "web-portal"
            - name: SOAR_ENGINE_URL
              value: "http://soar-engine.plg-stack.svc.cluster.local:8080"
            - name: FRAUD_DETECTION_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.financial.svc.cluster.local:6379/0"
            - name: LOKI_URL
              value: "http://loki.plg-stack.svc.cluster.local:3100"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: admin-password
            - name: INITIAL_BALANCE
              value: "10000000"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: patch-web-portal
              mountPath: /app/main.py
              subPath: main.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: envoy
          image: envoyproxy/envoy:v1.29-latest
          command: ["/bin/sh", "-c"]
          args:
            - sed "s|__SPIFFE_ID__|${SPIFFE_ID}|g" /etc/envoy/envoy.yaml > /tmp/envoy.yaml && envoy -c /tmp/envoy.yaml --log-level warning
          env:
            - name: SPIFFE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['spiffe.io/spiffeid']
          ports:
            - containerPort: 15006
              name: envoy-inbound
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-sockets
              mountPath: /run/spire/sockets
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: financial
spec:
  selector:
    app: web-portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: envoy-inbound
      port: 15006
      targetPort: 15006
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-portal
  namespace: financial
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`portal.ztlab.local`)
      kind: Rule
      services:
        - name: web-portal
          port: 8080
