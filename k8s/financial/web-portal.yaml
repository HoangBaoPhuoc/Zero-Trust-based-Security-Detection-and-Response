---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-portal
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: financial
  labels:
    app: web-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      serviceAccountName: web-portal
      containers:
        - name: web-portal
          image: ztlab/web-portal:1.2.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLOUD_PROVIDER
              value: "aws"
            - name: API_GATEWAY_URL
              value: "http://api-gateway.financial.svc.cluster.local:8080"
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local:8080"
            - name: KEYCLOAK_PUBLIC_URL
              value: "http://127.0.0.1:8180"
            - name: KEYCLOAK_REALM
              value: "ztlab"
            - name: KEYCLOAK_CLIENT_ID
              value: "web-portal"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service.financial.svc.cluster.local:8080"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service.financial.svc.cluster.local:8080"
            - name: SECURITY_SCORER_URL
              value: "http://security-scorer.plg-stack.svc.cluster.local:8080"
            - name: FRAUD_DETECTION_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: admin-password
            - name: INITIAL_BALANCE
              value: "10000000"
            - name: SOAR_ENGINE_URL
              value: "http://soar-engine.plg-stack.svc.cluster.local:8080"
            - name: SOAR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: SOAR_API_TOKEN
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: financial
spec:
  selector:
    app: web-portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-portal
  namespace: financial
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`portal.ztlab.local`)
      kind: Rule
      services:
        - name: web-portal
          port: 8080
