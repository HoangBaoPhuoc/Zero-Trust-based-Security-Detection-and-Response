---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-portal
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: financial
  labels:
    app: web-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/web-portal"
        # Istio (Phase 6 batch 3): migrated. The envoy-inbound:15006 listener
        # this Deployment used to carry was dead code — nothing in the repo
        # ever called web-portal via it (both its own outbound calls,
        # API_GATEWAY_URL and FRAUD_DETECTION_URL, already dialed the target
        # Service's plain HTTP port directly, bypassing envoy entirely; grep
        # confirms no cluster elsewhere routes to web-portal:15006 either).
        # Public Traefik ingress on :8080 needs no client cert, which
        # Istio's PERMISSIVE mode already accommodates (proven by
        # api-gateway's identical Traefik-facing setup).
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: web-portal
      volumes:
        - name: patch-web-portal
          configMap:
            name: patch-web-portal
        - name: patch-web-portal-templates
          configMap:
            name: patch-web-portal-templates
        - name: attack-surface-graph
          configMap:
            name: attack-surface-graph
            optional: true
      containers:
        - name: web-portal
          image: ztlab/web-portal:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLOUD_PROVIDER
              value: "aws"
            - name: API_GATEWAY_URL
              value: "http://api-gateway.financial.svc.cluster.local:8080"
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local:8080"
            - name: KEYCLOAK_PUBLIC_URL
              value: "http://keycloak.ztlab.local:8180"
            - name: KEYCLOAK_REALM
              value: "ztlab"
            - name: KEYCLOAK_CLIENT_ID
              value: "web-portal"
            - name: SOAR_ENGINE_URL
              value: "http://soar-engine.plg-stack.svc.cluster.local:8080"
            - name: FRAUD_DETECTION_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.financial.svc.cluster.local:6379/0"
            - name: LOKI_URL
              value: "http://loki.plg-stack.svc.cluster.local:3100"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: admin-password
            - name: INITIAL_BALANCE
              value: "10000000"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-portal-secret
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: patch-web-portal
              mountPath: /app/main.py
              subPath: main.py
            - name: patch-web-portal-templates
              mountPath: /app/templates
              readOnly: true
            - name: attack-surface-graph
              mountPath: /app/results/attack_surface_graph.md
              subPath: attack_surface_graph.md
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: financial
spec:
  selector:
    app: web-portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-portal
  namespace: financial
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`portal.ztlab.local`)
      kind: Rule
      services:
        - name: web-portal
          port: 8080
