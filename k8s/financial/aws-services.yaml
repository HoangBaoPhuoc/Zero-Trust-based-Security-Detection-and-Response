apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-detection
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: financial
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/api-gateway"
        # Istio (Phase 6): migrated — hand-rolled Envoy removed, istio-proxy
        # takes over. SPIRE stays the cert source via the Workload API socket
        # (see notification-service comment for the full mechanism).
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: api-gateway
      volumes:
        - name: patch-api-gateway
          configMap:
            name: patch-api-gateway
      containers:
        - name: api-gateway
          image: ztlab/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            # Istio intercepts this transparently and applies mTLS since
            # payment-service is also mesh-managed — no more local envoy
            # path router at 127.0.0.1:15001.
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service.financial.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.financial.svc.cluster.local:6379/0"
            - name: IP_BLOCK_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: patch-api-gateway
              mountPath: /app/main.py
              subPath: main.py
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: financial
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      # Istio intercepts transparently — Service targets the real app port.
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: financial
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/payment-service"
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: payment-service
      volumes:
        - name: patch-payment-service
          configMap:
            name: patch-payment-service
        - name: patch-shared
          configMap:
            name: patch-shared
      containers:
        - name: payment-service
          image: ztlab/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          volumeMounts:
            - name: patch-payment-service
              mountPath: /app/main.py
              subPath: main.py
            - name: patch-shared
              mountPath: /app/shared/posture.py
              subPath: posture.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            # core-banking is cross-cloud (OpenStack), not yet Istio-migrated
            # — reached via ServiceEntry+DestinationRule
            # (istio-cross-cloud-core-banking) so Istio still applies
            # SPIRE-sourced mTLS to this external NodePort, same as before.
            # core-banking-openstack is a selector-less Service + manually
            # managed Endpoints (istio-policies.yaml) giving a stable
            # internal DNS name to the OpenStack NodePort — CoreDNS resolves
            # it natively, Istio applies ISTIO_MUTUAL to it like any other
            # in-mesh destination.
            - name: CORE_BANKING_URL
              value: "http://core-banking-openstack.financial.svc.cluster.local:30080"
            - name: CORE_BANKING_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-banking-integrity-secret
                  key: shared-secret
            - name: MAX_SINGLE_TXN_VND
              value: "500000000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: financial
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
