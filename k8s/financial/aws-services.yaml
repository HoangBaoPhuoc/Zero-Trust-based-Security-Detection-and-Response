apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-detection
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: financial
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/api-gateway"
    spec:
      serviceAccountName: api-gateway
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
            items:
              - key: envoy-sidecar.yaml
                path: envoy.yaml
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
      containers:
        - name: api-gateway
          image: ztlab/api-gateway:1.2.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PAYMENT_SERVICE_URL
              value: "http://127.0.0.1:15001"
            - name: REDIS_URL
              value: "redis://redis.financial.svc.cluster.local:6379/2"
            - name: IP_BLOCK_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: envoy
          image: envoyproxy/envoy:v1.29-latest
          command: ["/bin/sh", "-c"]
          args:
            - sed "s|__SPIFFE_ID__|${SPIFFE_ID}|g" /etc/envoy/envoy.yaml > /tmp/envoy.yaml && envoy -c /tmp/envoy.yaml --log-level warning
          env:
            - name: SPIFFE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['spiffe.io/spiffeid']
          ports:
            - containerPort: 15006
              name: envoy-inbound
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-sockets
              mountPath: /run/spire/sockets
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: financial
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 15006
---
