          env:
            - name: SPIFFE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['spiffe.io/spiffeid']
          ports:
            - containerPort: 15006
              name: envoy-inbound
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-sockets
              mountPath: /run/spire/sockets
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
