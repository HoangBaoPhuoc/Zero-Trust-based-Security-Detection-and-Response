apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: financial
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/notification-service"
        # Istio canary (Phase 6): hand-rolled Envoy sidecar removed below,
        # istio-proxy takes over mTLS + inbound interception. SPIRE stays the
        # cert source (not Istio's own Citadel): pilot-agent (inside
        # istio-proxy) checks for a Workload API socket at the well-known
        # path /var/run/secrets/workload-spiffe-uds/socket BEFORE starting
        # Envoy — if found, it uses that as the SDS source instead of
        # spinning up its own local Citadel-backed SDS server (confirmed via
        # istio-proxy logs: "Workload SDS socket not found. Starting Istio
        # SDS Server" when this mount is absent). SPIRE's agent socket speaks
        # the Envoy SDS protocol natively and already serves secrets named
        # "default"/"ROOTCA" — the exact names istio-proxy requests — so the
        # SPIRE socket FILE (not just its directory) must be bind-mounted at
        # that exact path. An earlier EnvoyFilter approach (patching the
        # sds-grpc cluster) did NOT work — that only affects Envoy's own
        # xDS-delivered config, not pilot-agent's pre-Envoy startup check.
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: ztlab/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: port
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: from
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: financial
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      # Istio intercepts traffic transparently via iptables — Service targets
      # the real app port now, not the old hand-rolled Envoy's 15006.
      targetPort: 8080
