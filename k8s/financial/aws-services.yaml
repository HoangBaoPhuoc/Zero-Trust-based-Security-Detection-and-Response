apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: financial
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/notification-service"
    spec:
      serviceAccountName: notification-service
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
            items:
              - key: envoy-sidecar.yaml
                path: envoy.yaml
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
      containers:
        - name: notification-service
          image: ztlab/notification-service:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: port
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: from
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
