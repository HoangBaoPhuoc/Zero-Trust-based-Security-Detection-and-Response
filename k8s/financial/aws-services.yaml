apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-detection
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: financial
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/api-gateway"
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: ztlab/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service.financial.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: financial
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: financial
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/payment-service"
    spec:
      serviceAccountName: payment-service
      containers:
        - name: payment-service
          image: ztlab/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            - name: CORE_BANKING_URL
              value: "http://core-banking.financial.svc.cluster.local:8080"
            - name: MAX_SINGLE_TXN_VND
              value: "500000000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: financial
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
