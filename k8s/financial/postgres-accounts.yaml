apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-accounts-pvc
  namespace: financial
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-accounts
  namespace: financial
  labels:
    app: postgres-accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-accounts
  template:
    metadata:
      labels:
        app: postgres-accounts
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: accounts_db
            - name: POSTGRES_USER
              value: accounts_user
            - name: POSTGRES_PASSWORD
              value: accounts_pass
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U accounts_user -d accounts_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-accounts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-accounts
  namespace: financial
spec:
  selector:
    app: postgres-accounts
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
