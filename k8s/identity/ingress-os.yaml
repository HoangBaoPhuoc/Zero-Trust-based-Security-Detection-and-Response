# A1 — Keycloak chạy trên cụm OpenStack. Traefik IngressRoute cho Keycloak UI
# (keycloak.ztlab.local + localhost) nay nằm ở cụm OpenStack, không phải AWS.
# Áp bằng: kubectl --context ctx-openstack apply -f k8s/identity/ingress-os.yaml
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: identity
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`keycloak.ztlab.local`)
    kind: Rule
    services:
    - name: keycloak
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-localhost
  namespace: identity
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`localhost`)
    kind: Rule
    services:
    - name: keycloak
      port: 8080
