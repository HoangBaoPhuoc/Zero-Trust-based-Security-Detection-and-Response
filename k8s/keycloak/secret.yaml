# Example only. The deploy scripts create keycloak-secret from environment
# variables or random values so real credentials are not stored in git.
#
# To create manually:
# kubectl -n identity create secret generic keycloak-secret \
#   --from-literal=admin-password='<strong-admin-password>' \
#   --from-literal=postgres-password='<strong-db-password>'
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: identity
type: Opaque
stringData:
  admin-password: change-me-before-manual-apply
  postgres-password: change-me-before-manual-apply
