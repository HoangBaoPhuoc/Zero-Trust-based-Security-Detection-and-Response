# Traefik IngressRoute — expose key services via HTTP (SSH tunnel).
# crAPI: điểm vào ở k8s/crapi/ingress-aws.yaml (crapi.ztlab.local → bff) +
# ingress-os.yaml (mailhog.ztlab.local). File này chỉ còn các service chung.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: plg-stack
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`grafana.ztlab.local`)
    kind: Rule
    services:
    - name: grafana
      port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: identity
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`keycloak.ztlab.local`)
    kind: Rule
    services:
    - name: keycloak
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-localhost
  namespace: identity
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`localhost`)
    kind: Rule
    services:
    - name: keycloak
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: soar-engine
  namespace: plg-stack
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`soar.ztlab.local`)
    kind: Rule
    services:
    - name: soar-engine
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`prometheus.ztlab.local`)
    kind: Rule
    services:
    - name: prometheus
      port: 9090
