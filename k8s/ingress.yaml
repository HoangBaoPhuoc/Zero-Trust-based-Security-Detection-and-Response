# Traefik IngressRoute — expose key services via HTTP (SSH tunnel).
# crAPI: điểm vào ở k8s/crapi/ingress-aws.yaml (crapi.ztlab.local → bff) +
# ingress-os.yaml (mailhog.ztlab.local). File này chỉ còn các service chung.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: plg-stack
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`grafana.ztlab.local`)
    kind: Rule
    services:
    - name: grafana
      port: 3000
# A1: Keycloak IngressRoutes moved to the OpenStack cluster — see
# k8s/identity/ingress-os.yaml (Keycloak Service no longer exists on AWS).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: incident-analyzer
  namespace: plg-stack
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`incident-analyzer.ztlab.local`)
    kind: Rule
    services:
    - name: incident-analyzer
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`prometheus.ztlab.local`)
    kind: Rule
    services:
    - name: prometheus
      port: 9090
