# Namespace `monitoring` được khai báo DUY NHẤT ở k8s/namespaces.yaml (kèm nhãn
# istio-injection=enabled). KHÔNG khai lại ở đây: một object Namespace không nhãn
# trong file này từng ghi đè nhãn injection khi `kubectl apply` -> Prometheus
# lên không sidecar (xem BAOCAO-CUOI-2026-09-26.md mục 1.3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: ztlab-aws
        env: ztlab

    scrape_configs:
      # (Vòng cuối 2026-09-26) ĐÃ GỠ job `crapi-services-aws` (scrape
      # bff.crapi:8080/metrics): bff (services/bff/main.py) KHÔNG có route
      # /metrics — request rơi xuống proxy catch-all tới crapi-web và trả 404,
      # target luôn `down`. Job này là dấu vết của ứng dụng finance cũ (bff/engine
      # detection có metrics). crapi-web/community/workshop là ảnh stock crAPI,
      # không expose Prometheus metrics; các workload crAPI chỉ quan sát qua
      # istio access log/OPA decision log ở Loki. Muốn có metrics của bff thì phải
      # thêm instrumentation vào bff trước rồi mới khai lại job (xem
      # HAN-CHE-VA-HUONG-PHAT-TRIEN.md).

      # Loki internal metrics
      - job_name: loki
        static_configs:
          - targets:
              - loki.plg-stack.svc.cluster.local:3100
        metrics_path: /metrics

      # PLG-stack services (incident-analyzer exposes ztlab_evidence_bundles_total
      # and ztlab_incident_priority_score)
      - job_name: plg-stack-services
        static_configs:
          - targets:
              - incident-analyzer.plg-stack.svc.cluster.local:8080
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^.]+)\..*'
            target_label: service
          - target_label: cloud
            replacement: aws

      # Prometheus self-scrape
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # A2 hardening: bff PeerAuthentication is STRICT — Prometheus scrapes
        # bff.crapi.svc.cluster.local:8080/metrics directly (job crapi-services-aws),
        # so it needs a real mesh identity or that scrape target goes down.
        # /metrics is already unconditional public_path in zta_crapi.rego, so
        # this only grants mTLS transport, not extra authz.
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/prometheus"
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prometheus.ztlab.local`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
