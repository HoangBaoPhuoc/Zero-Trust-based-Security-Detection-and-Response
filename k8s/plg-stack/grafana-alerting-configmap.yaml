apiVersion: v1
data:
  access-denied-spike-alert.yml: |
    apiVersion: 1
    groups:
    - folder: ZTLab
      interval: 1m
      name: access-denied-spike
      orgId: 1
      rules:
      - annotations:
          admin_action: 'HƯỚNG DẪN XỬ LÝ:

            1. Xác nhận IP nguồn từ OPA Decision Log dashboard

            2. SOAR tự động block_source_ip nếu mức medium+

            3. Kiểm tra Web Portal /security -> blocked IPs

            '
          description: ATT&CK T1078 — IP nguồn đang probe các endpoint trái phép liên
            tiếp.
          summary: OPA deny rate tăng đột biến từ cùng source_ip
        condition: A
        data:
        - datasourceUid: Loki
          model:
            datasource:
              type: loki
              uid: Loki
            expr: sum by (source_ip) (count_over_time({job="opa-decisions"} | json | result="deny"
              [1m]))
            instant: true
            queryType: instant
            refId: A
          refId: A
          relativeTimeRange:
            from: 60
            to: 0
        execErrState: Alerting
        for: 0s
        labels:
          attack_type: access_denied
          category: security
          mitre: T1078
          severity: high
        noDataState: OK
        title: Access Denied Spike
        uid: access-denied-spike
  brute-force-alert.yml: |
    apiVersion: 1
    groups:
    - folder: ZTLab
      interval: 1m
      name: brute-force
      orgId: 1
      rules:
      - annotations:
          admin_action: 'HƯỚNG DẪN XỬ LÝ:

            1. Vào Web Portal /security → xem incident "brute_force"

            2. Nhấn "Block IP" → chặn IP nguồn (Redis, TTL 24h), api-gateway reject ngay

            3. Nhấn "Revoke All Sessions" nếu nghi account bị compromise

            4. Xem log: Grafana → Envoy Access Logs → filter source_ip

            5. Nhấn "Acknowledge" để đóng incident sau xử lý

            '
          description: ATT&CK T1110.001 — Kẻ tấn công đang thử đoán mật khẩu. OPA đã log
            request bị từ chối từ IP nguồn.
          summary: Brute force login — nhiều lần 401 từ cùng source_ip trong 1 phút
        condition: A
        data:
        - datasourceUid: Loki
          model:
            datasource:
              type: loki
              uid: Loki
            expr: sum by (source_ip) (count_over_time({job="envoy-access"} | json | response_code=`401`
              [1m]))
            instant: true
            queryType: instant
            refId: A
          refId: A
          relativeTimeRange:
            from: 60
            to: 0
        execErrState: Alerting
        for: 0s
        labels:
          attack_type: brute_force
          category: security
          mitre: T1110.001
          severity: high
        noDataState: OK
        title: Kịch bản 1 — Brute Force Login Detected
        uid: brute-force-login
  fraud-gate-bypass-alert.yml: |
    apiVersion: 1
    groups:
    - folder: ZTLab
      interval: 1m
      name: fraud-gate
      orgId: 1
      rules:
      - annotations:
          admin_action: 'HƯỚNG DẪN XỬ LÝ:

            1. Vào Web Portal /security → xem incident "fraud_gate_bypass"

            2. Nhấn "Scale Down Payment" để dừng thanh toán mới trong khi điều tra

            3. Kiểm tra: Grafana → OPA Decision Log → filter request_path=/transactions/execute

            4. Kiểm tra HMAC: kubectl logs -n financial deploy/payment-service

            5. Nhấn "Restore Payment" sau xác nhận payment-service hoạt động đúng

            6. Nhấn "Acknowledge" để đóng incident

            '
          description: ATT&CK T1078.004 — Request gọi POST /transactions/execute thiếu
            hoặc sai header X-Fraud-Gate/X-Fraud-Score. OPA từ chối.
          summary: Fraud Gate bypass — cố thực hiện giao dịch không qua fraud-detection
        condition: A
        data:
        - datasourceUid: Loki
          model:
            datasource:
              type: loki
              uid: Loki
            expr: '{job="opa-decisions",opa_result="false",request_path="/transactions/execute"}'
            instant: false
            queryType: range
            refId: A
          refId: A
          relativeTimeRange:
            from: 300
            to: 0
        execErrState: Alerting
        for: 0s
        labels:
          attack_type: fraud_gate_bypass
          category: security
          gap: gap2
          mitre: T1078.004
          severity: critical
        noDataState: OK
        title: Kịch bản 3 — Fraud Gate Bypass (Gap 2)
        uid: fraud-gate-bypass
  large-response-alert.yml: |
    apiVersion: 1
    groups:
    - folder: ZTLab
      interval: 1m
      name: gap1-exfiltration
      orgId: 1
      rules:
      - annotations:
          admin_action: 'HƯỚNG DẪN XỬ LÝ:

            1. Vào Web Portal /security → xem incident "exfiltration"

            2. Nhấn "Scale Down Banking" để dừng core-banking tạm thời

            3. Kiểm tra log: Grafana → Envoy Access Logs → filter bytes_sent>1M

            4. Kiểm tra endpoint: kubectl logs -n financial deploy/core-banking

            5. Nhấn "Restore Banking" sau xác nhận an toàn

            6. Nhấn "Acknowledge" để đóng incident

            '
          description: ATT&CK T1041 — Envoy log ghi bytes_sent > 1MB. Có thể đang dump
            database hoặc exfiltrate file.
          summary: Response >1MB từ Envoy — nghi ngờ data exfiltration
        condition: A
        data:
        - datasourceUid: Loki
          model:
            datasource:
              type: loki
              uid: Loki
            expr: '{job="envoy-access"} | json | bytes_sent > 1048576'
            instant: false
            queryType: range
            refId: A
          refId: A
          relativeTimeRange:
            from: 300
            to: 0
        execErrState: Alerting
        for: 0s
        labels:
          attack_type: large_response
          category: security
          gap: gap1
          mitre: T1041
          severity: high
        noDataState: OK
        title: Kịch bản 4 — Data Exfiltration Suspect (Gap 1)
        uid: gap1-large-response
  lateral-movement-alert.yml: |
    apiVersion: 1
    groups:
    - folder: ZTLab
      interval: 1m
      name: lateral-movement
      orgId: 1
      rules:
      - annotations:
          admin_action: 'HƯỚNG DẪN XỬ LÝ:

            1. Vào Web Portal /security → xem incident "lateral_movement"

            2. Nhấn "Scale Down Payment" để dừng payment-service tạm thời

            3. Kiểm tra SVID vi phạm: Grafana → OPA Decision Log → filter opa_result=false

            4. Kiểm tra log Envoy: kubectl logs -n financial deploy/payment-service -c
            envoy

            5. Nhấn "Restore Payment" sau khi xác nhận an toàn

            6. Nhấn "Acknowledge" để đóng incident

            '
          description: ATT&CK T1021.007 — Service cố truy cập service khác với SPIFFE
            ID sai hoặc không được phép. OPA từ chối và ghi log.
          summary: OPA từ chối request — SVID không hợp lệ hoặc ngoài allowlist
        condition: A
        data:
        - datasourceUid: Loki
          model:
            datasource:
              type: loki
              uid: Loki
            expr: '{job="opa-decisions",opa_result="false"}'
            instant: false
            queryType: range
            refId: A
          refId: A
          relativeTimeRange:
            from: 300
            to: 0
        execErrState: Alerting
        for: 0s
        labels:
          attack_type: lateral_movement
          category: security
          mitre: T1021.007
          severity: critical
        noDataState: OK
        title: 'Kịch bản 2 — Lateral Movement: Invalid SVID'
        uid: lateral-movement-svid
  notification-policy.yml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: ztlab-security-admin
        receivers:
          - uid: ztlab-admin-email
            type: email
            settings:
              addresses: "voha2005@gmail.com"
              subject: >-
                [ZTLab SECURITY] {{ .CommonLabels.alertname }} — {{ .CommonLabels.severity | toUpper }}
              message: |
                CẢNH BÁO BẢO MẬT — ZTLab Zero Trust
                ══════════════════════════════════════════

                Alert:    {{ .CommonLabels.alertname }}
                Severity: {{ .CommonLabels.severity | toUpper }}
                MITRE:    {{ .CommonLabels.mitre }}
                Time:     {{ now | date "2006-01-02 15:04:05 UTC" }}

                ──────────────────────────────────────────
                {{ range .Alerts.Firing -}}
                SỰ KIỆN: {{ .Annotations.summary }}

                MÔ TẢ: {{ .Annotations.description }}
                {{ end }}
                ──────────────────────────────────────────
                HƯỚNG DẪN XỬ LÝ CHO ADMIN:
                {{ .CommonAnnotations.admin_action }}
                ──────────────────────────────────────────

                Web Portal: http://127.0.0.1:18081/security
                Grafana:    http://127.0.0.1:3000/alerting/list
            disableResolveMessage: false
          - uid: ztlab-soar-webhook
            type: webhook
            settings:
              url: http://soar-engine.plg-stack.svc.cluster.local:8080/grafana-webhook
              httpMethod: POST
            disableResolveMessage: true

    policies:
      - orgId: 1
        receiver: ztlab-security-admin
        group_by:
          - grafana_folder
          - alertname
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: ztlab-security-admin
            matchers:
              - 'category="security"'
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 1h
  soar-health-alert.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: soar-health
        folder: ZTLab
        interval: 2m
        rules:
          - uid: soar-engine-health
            title: "SOAR Engine Health"
            for: 2m
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: Loki
                model:
                  datasource:
                    type: loki
                    uid: Loki
                  expr: 'sum(count_over_time({app="soar-engine"} [5m]))'
                  instant: true
                  queryType: instant
                  refId: A
            noDataState: Alerting
            execErrState: Alerting
            annotations:
              summary: "SOAR Engine pod không có log trong 5 phút"
              description: "SOAR Engine có thể bị down — phản ứng tự động với security incidents bị vô hiệu."
            labels:
              severity: warning
              category: ops
              mitre: ""
