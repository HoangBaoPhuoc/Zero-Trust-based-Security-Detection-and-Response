apiVersion: v1
data:
  access-denied-spike-alert.yml: "apiVersion: 1\ngroups:\n  - orgId: 1\n    name:\
    \ access-denied-spike\n    folder: ZTLab\n    interval: 1m\n    rules:\n     \
    \ - uid: access-denied-spike\n        title: \"Access Denied Spike\"\n       \
    \ for: 0s\n        condition: A\n        data:\n          - refId: A\n       \
    \     relativeTimeRange:\n              from: 60\n              to: 0\n      \
    \      datasourceUid: Loki\n            model:\n              datasource:\n  \
    \              type: loki\n                uid: Loki\n              expr: 'sum\
    \ by (source_ip) (count_over_time({job=\"opa-decisions\"} | json | result=\"deny\"\
    \ [1m]))'\n              instant: true\n              queryType: instant\n   \
    \           refId: A\n        noDataState: OK\n        execErrState: Alerting\n\
    \        annotations:\n          summary: \"OPA deny rate tăng đột biến từ cùng\
    \ source_ip\"\n          description: \"ATT&CK T1078 — IP nguồn đang probe các\
    \ endpoint trái phép liên tiếp.\"\n          admin_action: |\n            HƯỚNG\
    \ DẪN XỬ LÝ:\n            1. Xác nhận IP nguồn từ OPA Decision Log dashboard\n\
    \            2. SOAR tự động block_source_ip nếu mức medium+\n            3. Kiểm\
    \ tra Web Portal /security -> blocked IPs\n        labels:\n          severity:\
    \ high\n          category: security\n          mitre: T1078\n"
  brute-force-alert.yml: "apiVersion: 1\n\ngroups:\n  - orgId: 1\n    name: brute-force\n\
    \    folder: ZTLab\n    interval: 1m\n    rules:\n      - uid: brute-force-login\n\
    \        title: \"Kịch bản 1 — Brute Force Login Detected\"\n        for: 0s\n\
    \        condition: A\n        data:\n          - refId: A\n            relativeTimeRange:\n\
    \              from: 60\n              to: 0\n            datasourceUid: Loki\n\
    \            model:\n              datasource:\n                type: loki\n \
    \               uid: Loki\n              expr: 'sum by (source_ip) (count_over_time({job=\"\
    envoy-access\"} | json | response_code=`401` [1m]))'\n              instant: true\n\
    \              queryType: instant\n              refId: A\n        noDataState:\
    \ OK\n        execErrState: Alerting\n        annotations:\n          summary:\
    \ \"Brute force login — nhiều lần 401 từ cùng source_ip trong 1 phút\"\n     \
    \     description: \"ATT&CK T1110.001 — Kẻ tấn công đang thử đoán mật khẩu. OPA\
    \ đã log request bị từ chối từ IP nguồn.\"\n          admin_action: |\n      \
    \      HƯỚNG DẪN XỬ LÝ:\n            1. Vào Web Portal /security → xem incident\
    \ \"brute_force\"\n            2. Nhấn \"Block IP\" → chặn IP nguồn (Redis, TTL\
    \ 24h), api-gateway reject ngay\n            3. Nhấn \"Revoke All Sessions\" nếu\
    \ nghi account bị compromise\n            4. Xem log: Grafana → Envoy Access Logs\
    \ → filter source_ip\n            5. Nhấn \"Acknowledge\" để đóng incident sau\
    \ xử lý\n        labels:\n          severity: high\n          category: security\n\
    \          mitre: T1110.001\n"
  fraud-gate-bypass-alert.yml: "apiVersion: 1\n\ngroups:\n  - orgId: 1\n    name:\
    \ fraud-gate\n    folder: ZTLab\n    interval: 1m\n    rules:\n      - uid: fraud-gate-bypass\n\
    \        title: \"Kịch bản 3 — Fraud Gate Bypass (Gap 2)\"\n        for: 0s\n\
    \        condition: A\n        data:\n          - refId: A\n            relativeTimeRange:\n\
    \              from: 300\n              to: 0\n            datasourceUid: Loki\n\
    \            model:\n              datasource:\n                type: loki\n \
    \               uid: Loki\n              expr: '{job=\"opa-decisions\",opa_result=\"\
    false\",request_path=\"/transactions/execute\"}'\n              instant: false\n\
    \              queryType: range\n              refId: A\n        noDataState:\
    \ OK\n        execErrState: Alerting\n        annotations:\n          summary:\
    \ \"Fraud Gate bypass — cố thực hiện giao dịch không qua fraud-detection\"\n \
    \         description: \"ATT&CK T1078.004 — Request gọi POST /transactions/execute\
    \ thiếu hoặc sai header X-Fraud-Gate/X-Fraud-Score. OPA từ chối.\"\n         \
    \ admin_action: |\n            HƯỚNG DẪN XỬ LÝ:\n            1. Vào Web Portal\
    \ /security → xem incident \"fraud_gate_bypass\"\n            2. Nhấn \"Scale\
    \ Down Payment\" để dừng thanh toán mới trong khi điều tra\n            3. Kiểm\
    \ tra: Grafana → OPA Decision Log → filter request_path=/transactions/execute\n\
    \            4. Kiểm tra HMAC: kubectl logs -n financial deploy/payment-service\n\
    \            5. Nhấn \"Restore Payment\" sau xác nhận payment-service hoạt động\
    \ đúng\n            6. Nhấn \"Acknowledge\" để đóng incident\n        labels:\n\
    \          severity: critical\n          category: security\n          gap: gap2\n\
    \          mitre: T1078.004\n"
  large-response-alert.yml: "apiVersion: 1\n\ngroups:\n  - orgId: 1\n    name: gap1-exfiltration\n\
    \    folder: ZTLab\n    interval: 1m\n    rules:\n      - uid: gap1-large-response\n\
    \        title: \"Kịch bản 4 — Data Exfiltration Suspect (Gap 1)\"\n        for:\
    \ 0s\n        condition: A\n        data:\n          - refId: A\n            relativeTimeRange:\n\
    \              from: 300\n              to: 0\n            datasourceUid: Loki\n\
    \            model:\n              datasource:\n                type: loki\n \
    \               uid: Loki\n              expr: '{job=\"envoy-access\"} | json\
    \ | bytes_sent > 1048576'\n              instant: false\n              queryType:\
    \ range\n              refId: A\n        noDataState: OK\n        execErrState:\
    \ Alerting\n        annotations:\n          summary: \"Response >1MB từ Envoy\
    \ — nghi ngờ data exfiltration\"\n          description: \"ATT&CK T1041 — Envoy\
    \ log ghi bytes_sent > 1MB. Có thể đang dump database hoặc exfiltrate file.\"\n\
    \          admin_action: |\n            HƯỚNG DẪN XỬ LÝ:\n            1. Vào Web\
    \ Portal /security → xem incident \"exfiltration\"\n            2. Nhấn \"Scale\
    \ Down Banking\" để dừng core-banking tạm thời\n            3. Kiểm tra log: Grafana\
    \ → Envoy Access Logs → filter bytes_sent>1M\n            4. Kiểm tra endpoint:\
    \ kubectl logs -n financial deploy/core-banking\n            5. Nhấn \"Restore\
    \ Banking\" sau xác nhận an toàn\n            6. Nhấn \"Acknowledge\" để đóng\
    \ incident\n        labels:\n          severity: high\n          category: security\n\
    \          gap: gap1\n          mitre: T1041\n"
  lateral-movement-alert.yml: "apiVersion: 1\n\ngroups:\n  - orgId: 1\n    name: lateral-movement\n\
    \    folder: ZTLab\n    interval: 1m\n    rules:\n      - uid: lateral-movement-svid\n\
    \        title: \"Kịch bản 2 — Lateral Movement: Invalid SVID\"\n        for:\
    \ 0s\n        condition: A\n        data:\n          - refId: A\n            relativeTimeRange:\n\
    \              from: 300\n              to: 0\n            datasourceUid: Loki\n\
    \            model:\n              datasource:\n                type: loki\n \
    \               uid: Loki\n              expr: '{job=\"opa-decisions\",opa_result=\"\
    false\"}'\n              instant: false\n              queryType: range\n    \
    \          refId: A\n        noDataState: OK\n        execErrState: Alerting\n\
    \        annotations:\n          summary: \"OPA từ chối request — SVID không hợp\
    \ lệ hoặc ngoài allowlist\"\n          description: \"ATT&CK T1021.007 — Service\
    \ cố truy cập service khác với SPIFFE ID sai hoặc không được phép. OPA từ chối\
    \ và ghi log.\"\n          admin_action: |\n            HƯỚNG DẪN XỬ LÝ:\n   \
    \         1. Vào Web Portal /security → xem incident \"lateral_movement\"\n  \
    \          2. Nhấn \"Scale Down Payment\" để dừng payment-service tạm thời\n \
    \           3. Kiểm tra SVID vi phạm: Grafana → OPA Decision Log → filter opa_result=false\n\
    \            4. Kiểm tra log Envoy: kubectl logs -n financial deploy/payment-service\
    \ -c envoy\n            5. Nhấn \"Restore Payment\" sau khi xác nhận an toàn\n\
    \            6. Nhấn \"Acknowledge\" để đóng incident\n        labels:\n     \
    \     severity: critical\n          category: security\n          mitre: T1021.007\n"
  notification-policy.yml: "apiVersion: 1\n\ncontactPoints:\n  - orgId: 1\n    name:\
    \ ztlab-security-admin\n    receivers:\n      - uid: ztlab-admin-email\n     \
    \   type: email\n        settings:\n          addresses: \"voha2005@gmail.com\"\
    \n          subject: >-\n            [ZTLab SECURITY] {{ .CommonLabels.alertname\
    \ }} — {{ .CommonLabels.severity | toUpper }}\n          message: |\n        \
    \    CẢNH BÁO BẢO MẬT — ZTLab Zero Trust\n            ══════════════════════════════════════════\n\
    \n            Alert:    {{ .CommonLabels.alertname }}\n            Severity: {{\
    \ .CommonLabels.severity | toUpper }}\n            MITRE:    {{ .CommonLabels.mitre\
    \ }}\n            Time:     {{ now | date \"2006-01-02 15:04:05 UTC\" }}\n\n \
    \           ──────────────────────────────────────────\n            {{ range .Alerts.Firing\
    \ -}}\n            SỰ KIỆN: {{ .Annotations.summary }}\n\n            MÔ TẢ: {{\
    \ .Annotations.description }}\n            {{ end }}\n            ──────────────────────────────────────────\n\
    \            HƯỚNG DẪN XỬ LÝ CHO ADMIN:\n            {{ .CommonAnnotations.admin_action\
    \ }}\n            ──────────────────────────────────────────\n\n            Web\
    \ Portal: http://127.0.0.1:18081/security\n            Grafana:    http://127.0.0.1:3000/alerting/list\n\
    \        disableResolveMessage: false\n      - uid: ztlab-soar-webhook\n     \
    \   type: webhook\n        settings:\n          url: http://soar-engine.plg-stack.svc.cluster.local:8080/grafana-webhook\n\
    \          httpMethod: POST\n        disableResolveMessage: true\n\npolicies:\n\
    \  - orgId: 1\n    receiver: ztlab-security-admin\n    group_by:\n      - grafana_folder\n\
    \      - alertname\n    group_wait: 10s\n    group_interval: 5m\n    repeat_interval:\
    \ 4h\n    routes:\n      - receiver: ztlab-security-admin\n        matchers:\n\
    \          - 'category=\"security\"'\n        group_wait: 10s\n        group_interval:\
    \ 5m\n        repeat_interval: 1h\n"
  soar-health-alert.yml: "apiVersion: 1\ngroups:\n  - orgId: 1\n    name: soar-health\n\
    \    folder: ZTLab\n    interval: 2m\n    rules:\n      - uid: soar-engine-health\n\
    \        title: \"SOAR Engine Health\"\n        for: 2m\n        condition: A\n\
    \        data:\n          - refId: A\n            relativeTimeRange:\n       \
    \       from: 300\n              to: 0\n            datasourceUid: Loki\n    \
    \        model:\n              datasource:\n                type: loki\n     \
    \           uid: Loki\n              expr: 'sum(count_over_time({app=\"soar-engine\"\
    } [5m]))'\n              instant: true\n              queryType: instant\n   \
    \           refId: A\n        noDataState: Alerting\n        execErrState: Alerting\n\
    \        annotations:\n          summary: \"SOAR Engine pod không có log trong\
    \ 5 phút\"\n          description: \"SOAR Engine có thể bị down — phản ứng tự\
    \ động với security incidents bị vô hiệu.\"\n        labels:\n          severity:\
    \ warning\n          category: ops\n          mitre: \"\"\n"
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: plg-stack

