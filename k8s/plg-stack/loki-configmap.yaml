apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: plg-stack
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 0.0.0.0
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      max_streams_per_user: 10000
      max_entries_limit_per_query: 50000
      # Phần 3.6 remediation (2026-09-19): retention THẬT SỰ nằm ở đây —
      # table_manager (đã xoá khỏi file này, legacy boltdb-shipper era) KHÔNG
      # áp dụng cho schema_config.store: tsdb đang dùng. compactor.
      # retention_enabled: true mà thiếu dòng này thì không có period nào để
      # thực thi — retention tắt câm lặng dù trông như đã bật. 30 ngày = dư
      # ~4x so với 150 giờ traffic nền cộng dồn Giai đoạn B cần (150h ≈ 6.25
      # ngày), đủ biên cho việc thu thập trải dài nhiều phiên + gán nhãn sau.
      retention_period: 720h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        cache_ttl: 24h

    chunk_store_config:
      chunk_cache_config:
        embedded_cache:
          enabled: true
          max_size_mb: 256
