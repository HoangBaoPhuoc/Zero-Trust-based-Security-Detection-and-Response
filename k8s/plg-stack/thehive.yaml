apiVersion: v1
kind: Service
metadata:
  name: thehive-cassandra
  namespace: plg-stack
spec:
  selector:
    app: thehive-cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: cql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thehive-cassandra
  namespace: plg-stack
spec:
  serviceName: thehive-cassandra
  replicas: 1
  selector:
    matchLabels:
      app: thehive-cassandra
  template:
    metadata:
      labels:
        app: thehive-cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: thehive
            - name: CASSANDRA_DC
              value: dc1
            - name: CASSANDRA_RACK
              value: rack1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          readinessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 45
            periodSeconds: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thehive-config
  namespace: plg-stack
data:
  application.conf: |
    play.http.secret.key = "ztlab-thehive-secret-change-me-2026-06-11"
    play.http.context = "/"

    auth {
      providers = [
        {name = session}
        {name = basic, realm = thehive}
        {name = local}
        {name = key}
      ]
    }

    db.janusgraph {
      storage {
        backend = cql
        hostname = ["thehive-cassandra"]
        cql {
          cluster-name = thehive
          keyspace = thehive
          replication-factor = 1
          local-datacenter = dc1
        }
      }
      index.search {
        backend = lucene
        directory = /opt/thp/thehive/index
      }
    }

    storage {
      provider = localfs
      localfs.location = /opt/thp/thehive/files
    }

    akka.http.parsing.max-content-length = 1g
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thehive-data-pvc
  namespace: plg-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thehive
  namespace: plg-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thehive
  template:
    metadata:
      labels:
        app: thehive
    spec:
      containers:
        - name: thehive
          image: strangebee/thehive:5.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"
          volumeMounts:
            - name: config
              mountPath: /etc/thehive/application.conf
              subPath: application.conf
            - name: data
              mountPath: /opt/thp/thehive
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1024Mi
            limits:
              cpu: 1500m
              memory: 2048Mi
      volumes:
        - name: config
          configMap:
            name: thehive-config
        - name: data
          persistentVolumeClaim:
            claimName: thehive-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: thehive
  namespace: plg-stack
spec:
  selector:
    app: thehive
  ports:
    - name: http
      port: 9000
      targetPort: http
