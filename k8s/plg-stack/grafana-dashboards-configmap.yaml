  envoy-access-logs.json: "{\n  \"uid\": \"ztlab-envoy-access-logs\",\n  \"title\"\
    : \"Envoy Access Logs\",\n  \"schemaVersion\": 39,\n  \"version\": 2,\n  \"refresh\"\
    : \"30s\",\n  \"tags\": [\n    \"ztlab\",\n    \"security\"\n  ],\n  \"time\"\
    : {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n \
    \   {\n      \"id\": 1,\n      \"title\": \"Request Rate by Cloud\",\n      \"\
    type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\"\
    : 0,\n        \"w\": 8,\n        \"h\": 4\n      },\n      \"datasource\": {\n\
    \        \"type\": \"loki\",\n        \"uid\": \"Loki\"\n      },\n      \"targets\"\
    : [\n        {\n          \"datasource\": {\n            \"type\": \"loki\",\n\
    \            \"uid\": \"Loki\"\n          },\n          \"expr\": \"sum by (cloud)\
    \ (rate({job=\\\"envoy-access\\\"}[1m]))\",\n          \"refId\": \"A\"\n    \
    \    }\n      ],\n      \"options\": {},\n      \"fieldConfig\": {\n        \"\
    defaults\": {},\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\"\
    : 2,\n      \"title\": \"Error Rate\",\n      \"type\": \"timeseries\",\n    \
    \  \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 8,\n \
    \       \"h\": 4\n      },\n      \"datasource\": {\n        \"type\": \"loki\"\
    ,\n        \"uid\": \"Loki\"\n      },\n      \"targets\": [\n        {\n    \
    \      \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\"\
    : \"Loki\"\n          },\n          \"expr\": \"sum(rate({job=\\\"envoy-access\\\
    \"} | json | response_code >= 400 [5m])) / sum(rate({job=\\\"envoy-access\\\"\
    }[5m]))\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\"\
    : {},\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\"\
    : []\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"P95 Response\
    \ Time by Cloud\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n  \
    \      \"x\": 16,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 4\n  \
    \    },\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\"\
    : \"Loki\"\n      },\n      \"targets\": [\n        {\n          \"datasource\"\
    : {\n            \"type\": \"loki\",\n            \"uid\": \"Loki\"\n        \
    \  },\n          \"expr\": \"quantile_over_time(0.95, {job=\\\"envoy-access\\\"\
    } | json | unwrap response_time [5m]) by (cloud)\",\n          \"refId\": \"A\"\
    \n        }\n      ],\n      \"options\": {},\n      \"fieldConfig\": {\n    \
    \    \"defaults\": {},\n        \"overrides\": []\n      }\n    },\n    {\n  \
    \    \"id\": 4,\n      \"title\": \"Recent Envoy Logs\",\n      \"type\": \"logs\"\
    ,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 4,\n        \"w\":\
    \ 24,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\":\
    \ \"loki\",\n        \"uid\": \"Loki\"\n      },\n      \"targets\": [\n     \
    \   {\n          \"datasource\": {\n            \"type\": \"loki\",\n        \
    \    \"uid\": \"Loki\"\n          },\n          \"expr\": \"{job=\\\"envoy-access\\\
    \"}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {},\n\
    \      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n\
    \      }\n    }\n  ]\n}\n"
