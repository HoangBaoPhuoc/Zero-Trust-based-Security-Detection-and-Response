apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-analyzer-patch
  namespace: plg-stack
data:
  main.py: |
    import asyncio
    import hashlib
    import json
    import logging
    import os
    import random
    import re
    import time
    import uuid
    from datetime import datetime, timezone
    from typing import Any, Literal

    import httpx
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel, Field

    APP_NAME = "ai-analyzer"
    LOKI_URL = os.getenv("LOKI_URL", "http://loki:3100").rstrip("/")
    AI_PROVIDER = os.getenv("AI_PROVIDER", "heuristic").lower()
    OPENAI_API_KEY = os.getenv("OPENAI_API_KEY", "")
    OPENAI_MODEL = os.getenv("OPENAI_MODEL", "gpt-4o-mini")
    GEMINI_API_KEY = os.getenv("GEMINI_API_KEY", "")
    GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-1.5-flash")
    POLL_ENABLED = os.getenv("AI_ANALYZER_POLL_ENABLED", "false").lower() == "true"
    MIN_ALERT_SEVERITY = os.getenv("AI_ANALYZER_MIN_ALERT_SEVERITY", "medium").lower()
    ADMIN_APPROVAL_SEVERITY = os.getenv("AI_ANALYZER_ADMIN_APPROVAL_SEVERITY", "high").lower()
    LOKI_QUERY = os.getenv("AI_ANALYZER_LOKI_QUERY", '{job=~"kubernetes-pods|envoy-access|opa-decisions|system|demo-raw"}')
    SOAR_WEBHOOK_URL = os.getenv("SOAR_WEBHOOK_URL", "").strip()
    SOAR_API_TOKEN = os.getenv("SOAR_API_TOKEN", "").strip()
    ADMIN_WEBHOOK_URL = os.getenv("ADMIN_WEBHOOK_URL", "").strip()
    PROVIDER_COOLDOWN_SECONDS = int(os.getenv("AI_PROVIDER_COOLDOWN_SECONDS", "900"))
    _provider_backoff_until = 0.0

    SEVERITY_RANK = {"low": 1, "medium": 2, "high": 3, "critical": 4}

    MALICIOUS_PATTERNS = [
        (re.compile(r"jwt_verification_failed|invalid_credentials|auth_failures_total|brute.?force|too.?many.?(request|attempt|login|failure)", re.I), "brute_force"),
        (re.compile(r"fraud_gate_bypass|fraud.gate|bypass.fraud", re.I), "fraud_gate_bypass"),
        (re.compile(r"lateral.?move|unauthorized_service_call|invalid.*svid|spiffe.*den|svid_not_authorized", re.I), "lateral_movement"),
        (re.compile(r"port.?scan|nmap|masscan|syn.?scan|network.?discover|ports_tried", re.I), "port_scan"),
        (re.compile(r"privilege.?escalation|setuid|cap_sys_admin", re.I), "privilege_escalation"),
        (re.compile(r"xmrig|cryptomin|stratum\+tcp|cpu_usage_spike", re.I), "cryptomining"),
        (re.compile(r"sqlmap|union.?select|/etc/passwd|cmd=|powershell|sql.?inject", re.I), "exploit_probe"),
        (re.compile(r"bytes_sent[=: ]([1-9]\d{6,})|large_response_detected|data_exfiltration_risk|data.?dump", re.I), "large_response"),
        (re.compile(r"credential.?stuf|multiple.usernames|common.password", re.I), "credential_stuffing"),
        (re.compile(r"jwt.*replay|stolen.token|suspicious.*reuse|token.*reuse", re.I), "jwt_replay"),
        (re.compile(r"container.?escape|host.filesys|169\.254\.169\.254|namespace.escape", re.I), "container_escape"),
        (re.compile(r"data.?staging|exfil.?prep", re.I), "data_staging"),
        (re.compile(r"impair.*defense|disable.*log|stop.*monitor|tamper.*audit", re.I), "impair_defenses"),
        (re.compile(r"account.?manipulat|account.?takeover|privilege.*change", re.I), "account_manipulation"),
        (re.compile(r"\b(401|403|denied|deny|unauthorized|forbidden)\b", re.I), "access_denied"),
    ]

    ATTACK_PLAYBOOKS = {
        "brute_force": "revoke_user_sessions",
        "credential_stuffing": "revoke_user_sessions",
        "jwt_replay": "revoke_user_sessions",
        "fraud_gate_bypass": "isolate_workload",
        "lateral_movement": "isolate_workload",
        "account_manipulation": "isolate_workload",
        "large_response": "restrict_egress",
        "data_staging": "restrict_egress",
        "cryptomining": "quarantine_workload",
        "container_escape": "quarantine_workload",
        "impair_defenses": "quarantine_workload",
        "privilege_escalation": "quarantine_workload",
        "port_scan": "block_source_ip",
        "exploit_probe": "block_source_ip",
        "access_denied": "block_source_ip",
    }

    ATTACK_MITRE = {
        "brute_force": "T1110.001", "credential_stuffing": "T1110.004",
        "jwt_replay": "T1550.001", "fraud_gate_bypass": "T1078.004",
        "lateral_movement": "T1021.007", "account_manipulation": "T1531",
        "large_response": "T1041", "data_staging": "T1074",
        "cryptomining": "T1496", "container_escape": "T1611",
        "impair_defenses": "T1562", "privilege_escalation": "T1068",
        "port_scan": "T1046", "exploit_probe": "T1203", "access_denied": "T1078",
    }

    logging.basicConfig(level=os.getenv("LOG_LEVEL", "INFO"), format="%(message)s")
    logger = logging.getLogger(APP_NAME)
    app = FastAPI(title="ZTLab AI Analyzer")

    def _env_int(name, default, minimum, maximum):
        raw = os.getenv(name, str(default))
        try:
            value = int(raw)
        except ValueError:
            return default
        return max(minimum, min(maximum, value))

    POLL_INTERVAL_SECONDS = _env_int("AI_ANALYZER_POLL_INTERVAL_SECONDS", 30, 5, 3600)
    LOOKBACK_SECONDS = _env_int("AI_ANALYZER_LOOKBACK_SECONDS", 90, 10, 86400)
    MAX_LOGS_PER_BATCH = _env_int("AI_ANALYZER_MAX_LOGS_PER_BATCH", 25, 1, 200)
    PENDING_TTL_SECONDS = _env_int("AI_ANALYZER_PENDING_TTL_SECONDS", 3600, 60, 86400)

    if MIN_ALERT_SEVERITY not in SEVERITY_RANK:
        MIN_ALERT_SEVERITY = "medium"
    if ADMIN_APPROVAL_SEVERITY not in SEVERITY_RANK:
        ADMIN_APPROVAL_SEVERITY = "high"

    class LogEntry(BaseModel):
        timestamp: str | None = None
        message: str
        labels: dict[str, str] = Field(default_factory=dict)

    class AnalyzeRequest(BaseModel):
        logs: list[LogEntry]
        source: str = "api"

    class AnalyzeResult(BaseModel):
        verdict: Literal["normal", "malicious", "suspicious"]
        severity: Literal["low", "medium", "high", "critical"]
        confidence: float = Field(ge=0, le=1)
        attack_type: str = "unknown"
        mitre: str = ""
        summary: str
        evidence: list[str] = Field(default_factory=list)
        recommended_action: str = "monitor"
        recommended_playbook: str | None = None
        affected_service: str | None = None
        source_ip: str | None = None
        provider_used: str = "heuristic"
        model_used: str = "rules"

    class AlertRecord(BaseModel):
        event_type: str = "ai_security_alert"
        analyzer: str = APP_NAME
        provider: str
        model: str
        source: str
        verdict: str
        severity: str
        confidence: float
        attack_type: str
        mitre: str = ""
        summary: str
        evidence: list[str]
        recommended_action: str
        recommended_playbook: str | None = None
        affected_service: str | None = None
        source_ip: str | None = None
        log_count: int
        log_hash: str
        ts: str

    class PendingAlert(BaseModel):
        alert_id: str
        alert: AlertRecord
        created_at: str
        expires_at: str
        status: Literal["pending", "approved", "dismissed", "expired"] = "pending"
        reviewed_at: str | None = None
        note: str | None = None

    class ApproveRequest(BaseModel):
        note: str | None = None

    class DismissRequest(BaseModel):
        note: str | None = None

    PENDING_ALERTS: dict[str, PendingAlert] = {}

    def _now_iso():
        return datetime.now(timezone.utc).isoformat()

    def _provider_cooldown_remaining():
        return max(0, int(_provider_backoff_until - time.time()))

    def _set_provider_backoff(exc):
        global _provider_backoff_until
        status_code = None
        retry_after = None
        if isinstance(exc, httpx.HTTPStatusError):
            status_code = exc.response.status_code
            ra = exc.response.headers.get("retry-after")
            if ra:
                try:
                    retry_after = max(1, min(3600, int(float(ra))))
                except ValueError:
                    pass
        delay = retry_after if status_code == 429 and retry_after else min(300, max(30, PROVIDER_COOLDOWN_SECONDS // 3))
        delay = int(delay + random.randint(0, min(30, max(1, delay // 10))))
        _provider_backoff_until = max(_provider_backoff_until, time.time() + delay)
        return delay

    def _safe_json_loads(value):
        try:
            return json.loads(value)
        except json.JSONDecodeError:
            return None

    def _flatten_log(entry):
        label_text = " ".join(f"{k}={v}" for k, v in sorted(entry.labels.items()))
        return f"{entry.timestamp or ''} {label_text} {entry.message}".strip()

    def _logs_hash(logs):
        digest = hashlib.sha256()
        for entry in logs:
            digest.update(_flatten_log(entry).encode("utf-8", errors="replace"))
        return digest.hexdigest()[:16]

    def _extract_source_ip(text):
        for pattern in [r"source_ip[=: ](?P<ip>\d{1,3}(?:\.\d{1,3}){3})", r"src_ip[=: ](?P<ip>\d{1,3}(?:\.\d{1,3}){3})", r"client_ip[=: ](?P<ip>\d{1,3}(?:\.\d{1,3}){3})"]:
            m = re.search(pattern, text, flags=re.I)
            if m:
                return m.group("ip")
        return None

    def _infer_affected_service(text, reasons):
        known = ["api-gateway", "payment-service", "fraud-detection", "notification-service", "core-banking", "account-service", "transaction-service"]
        lowered = text.lower()
        for svc in known:
            if svc in lowered:
                return svc
        svc_map = {"fraud_gate_bypass": "payment-service", "lateral_movement": "core-banking", "cryptomining": "transaction-service", "large_response": "core-banking", "data_staging": "core-banking", "port_scan": "api-gateway", "exploit_probe": "api-gateway"}
        for r in reasons:
            if r in svc_map:
                return svc_map[r]
        return None

    def _recommended_playbook(reasons):
        for r in reasons:
            if r in ATTACK_PLAYBOOKS:
                return ATTACK_PLAYBOOKS[r]
        return None

    def _primary_attack_type(reasons):
        priority = ["fraud_gate_bypass", "lateral_movement", "cryptomining", "container_escape", "large_response", "data_staging", "brute_force", "credential_stuffing", "jwt_replay", "port_scan", "exploit_probe", "privilege_escalation", "impair_defenses", "account_manipulation", "access_denied"]
        for a in priority:
            if a in reasons:
                return a
        return reasons[0] if reasons else "unknown"

    def _normalize_ai_json(raw_text):
        raw_text = raw_text.strip()
        parsed = _safe_json_loads(raw_text)
        if isinstance(parsed, dict):
            return parsed
        m = re.search(r"\{.*\}", raw_text, flags=re.S)
        if m:
            parsed = _safe_json_loads(m.group(0))
            if isinstance(parsed, dict):
                return parsed
        return {}

    def _coerce_ai_result(value):
        n = dict(value)
        verdict = str(n.get("verdict", "suspicious")).lower()
        if verdict not in {"normal", "suspicious", "malicious"}:
            verdict = "suspicious"
        n["verdict"] = verdict
        severity = str(n.get("severity", "medium")).lower()
        if severity not in SEVERITY_RANK:
            severity = "medium"
        n["severity"] = severity
        confidence = n.get("confidence", 0.6)
        if isinstance(confidence, str):
            confidence = {"low": 0.35, "medium": 0.6, "high": 0.8, "critical": 0.9}.get(confidence.strip().lower(), confidence)
        try:
            confidence = float(confidence)
        except (TypeError, ValueError):
            confidence = 0.6
        n["confidence"] = max(0.0, min(1.0, confidence))
        evidence = n.get("evidence", [])
        if isinstance(evidence, str):
            evidence = [evidence]
        elif not isinstance(evidence, list):
            evidence = []
        n["evidence"] = [str(i) for i in evidence[:5]]
        at = str(n.get("attack_type") or "unknown")
        n["attack_type"] = at
        n["mitre"] = n.get("mitre") or ATTACK_MITRE.get(at, "")
        n["summary"] = str(n.get("summary") or "AI classified the provided logs.")
        n["recommended_action"] = str(n.get("recommended_action") or "monitor")
        n["recommended_playbook"] = n.get("recommended_playbook") or None
        n["affected_service"] = n.get("affected_service") or None
        n["source_ip"] = n.get("source_ip") or None
        return AnalyzeResult.model_validate(n)

    def heuristic_analyze(logs):
        reasons = []
        evidence = []
        for entry in logs:
            text = _flatten_log(entry)
            for pattern, reason in MALICIOUS_PATTERNS:
                if pattern.search(text):
                    reasons.append(reason)
                    excerpt = text[:350]
                    if len(evidence) < 5 and excerpt not in evidence:
                        evidence.append(excerpt)
        if not reasons:
            return AnalyzeResult(verdict="normal", severity="low", confidence=0.72, attack_type="none", summary="No obvious malicious indicator was found in the provided logs.", recommended_action="continue monitoring")
        unique_reasons = list(dict.fromkeys(reasons))
        flattened = " ".join(_flatten_log(e) for e in logs)
        primary = _primary_attack_type(unique_reasons)
        critical_attacks = {"fraud_gate_bypass", "lateral_movement", "cryptomining", "container_escape", "privilege_escalation"}
        high_attacks = {"large_response", "brute_force", "credential_stuffing", "data_staging", "impair_defenses", "account_manipulation"}
        if critical_attacks & set(unique_reasons):
            severity = "critical"
        elif high_attacks & set(unique_reasons):
            severity = "high"
        elif len(unique_reasons) == 1 and unique_reasons == ["access_denied"]:
            severity = "medium"
        else:
            severity = "high"
        return AnalyzeResult(
            verdict="malicious" if severity in {"high", "critical"} else "suspicious",
            severity=severity, confidence=min(0.95, 0.62 + len(reasons) * 0.07),
            attack_type=primary, mitre=ATTACK_MITRE.get(primary, ""),
            summary=f"Heuristic detected: {', '.join(dict.fromkeys(unique_reasons))}.",
            evidence=evidence, recommended_action="investigate source identity, affected workload, and related OPA/Envoy decisions",
            recommended_playbook=_recommended_playbook(unique_reasons),
            affected_service=_infer_affected_service(flattened, unique_reasons),
            source_ip=_extract_source_ip(flattened),
        )

    def _merge_result_with_heuristic(result, heuristic):
        if heuristic.verdict == "normal":
            return result
        r_reasons = [r.strip() for r in result.attack_type.split(",") if r.strip() not in {"none", "unknown"}]
        h_reasons = [r.strip() for r in heuristic.attack_type.split(",") if r.strip() not in {"none", "unknown"}]
        merged = list(dict.fromkeys(r_reasons + h_reasons))
        severity = result.severity
        if SEVERITY_RANK[heuristic.severity] > SEVERITY_RANK[severity]:
            severity = heuristic.severity
        verdict = result.verdict
        if verdict == "normal" or SEVERITY_RANK[severity] >= SEVERITY_RANK["high"]:
            verdict = "malicious"
        primary = _primary_attack_type(merged) if merged else result.attack_type
        evidence = result.evidence or heuristic.evidence
        if result.evidence and heuristic.evidence:
            evidence = (result.evidence + [i for i in heuristic.evidence if i not in result.evidence])[:5]
        return AnalyzeResult(verdict=verdict, severity=severity, confidence=max(result.confidence, heuristic.confidence), attack_type=primary, mitre=result.mitre or ATTACK_MITRE.get(primary, ""), summary=result.summary or heuristic.summary, evidence=evidence, recommended_action=result.recommended_action or heuristic.recommended_action, recommended_playbook=result.recommended_playbook or heuristic.recommended_playbook, affected_service=result.affected_service or heuristic.affected_service, source_ip=result.source_ip or heuristic.source_ip)

    def _prompt(logs):
        compact_logs = [_flatten_log(e)[:800] for e in logs[:MAX_LOGS_PER_BATCH]]
        return ("You are a security analyst for a Zero Trust microservice lab. Classify the logs as normal, suspicious, or malicious. Return only valid JSON with keys: verdict, severity, confidence, attack_type, mitre, summary, evidence, recommended_action, recommended_playbook, affected_service, source_ip. recommended_playbook must be one of: isolate_workload, restrict_egress, quarantine_workload, block_source_ip, revoke_user_sessions, monitor_only, or null. Severity must be low, medium, high, or critical.\n\nLogs:\n" + json.dumps(compact_logs, ensure_ascii=True))

    async def openai_analyze(client, logs):
        headers = {"Authorization": f"Bearer {OPENAI_API_KEY}", "Content-Type": "application/json"}
        payload = {"model": OPENAI_MODEL, "messages": [{"role": "system", "content": "Return only compact JSON. Do not include markdown."}, {"role": "user", "content": _prompt(logs)}], "temperature": 0.1, "response_format": {"type": "json_object"}}
        response = await client.post("https://api.openai.com/v1/chat/completions", headers=headers, json=payload, timeout=45)
        response.raise_for_status()
        return _coerce_ai_result(_normalize_ai_json(response.json()["choices"][0]["message"]["content"]))

    async def gemini_analyze(client, logs):
        url = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent"
        headers = {"x-goog-api-key": GEMINI_API_KEY}
        payload = {"contents": [{"parts": [{"text": _prompt(logs)}]}], "generationConfig": {"temperature": 0.1, "responseMimeType": "application/json"}}
        response = await client.post(url, headers=headers, json=payload, timeout=45)
        response.raise_for_status()
        return _coerce_ai_result(_normalize_ai_json(response.json()["candidates"][0]["content"]["parts"][0]["text"]))

    async def analyze_logs(logs):
        if not logs:
            return AnalyzeResult(verdict="normal", severity="low", confidence=1.0, attack_type="none", summary="No logs were provided.", recommended_action="none")
        if _provider_cooldown_remaining() > 0:
            return heuristic_analyze(logs)
        async with httpx.AsyncClient() as client:
            try:
                if AI_PROVIDER == "openai" and OPENAI_API_KEY:
                    result = _merge_result_with_heuristic(await openai_analyze(client, logs), heuristic_analyze(logs))
                    result.provider_used = "openai"
                    result.model_used = OPENAI_MODEL
                    return result
                if AI_PROVIDER == "gemini" and GEMINI_API_KEY:
                    result = _merge_result_with_heuristic(await gemini_analyze(client, logs), heuristic_analyze(logs))
                    result.provider_used = "gemini"
                    result.model_used = GEMINI_MODEL
                    return result
            except Exception as exc:
                delay = _set_provider_backoff(exc)
                logger.warning(json.dumps({"event_type": "ai_provider_error", "provider": AI_PROVIDER, "error": str(exc)[:200], "cooldown_seconds": delay}))
        return heuristic_analyze(logs)

    async def forward_alert_to_soar(alert):
        if not SOAR_WEBHOOK_URL:
            return
        payload = {"verdict": alert.verdict, "severity": alert.severity, "confidence": alert.confidence, "attack_type": alert.attack_type, "mitre": alert.mitre, "summary": alert.summary, "source_ip": alert.source_ip, "affected_service": alert.affected_service, "recommended_playbook": alert.recommended_playbook, "source": f"ai-analyzer:{alert.source}", "ts": alert.ts}
        headers = {"Content-Type": "application/json"}
        if SOAR_API_TOKEN:
            headers["Authorization"] = f"Bearer {SOAR_API_TOKEN}"
        async with httpx.AsyncClient() as client:
            response = await client.post(SOAR_WEBHOOK_URL, json=payload, headers=headers, timeout=15)
            response.raise_for_status()

    async def push_alert_to_loki(alert, extra_labels=None):
        line = alert.model_dump_json()
        stream_labels = {"job": "ai-analyzer", "service": APP_NAME, "severity": alert.severity, "verdict": alert.verdict, "attack_type": alert.attack_type[:80]}
        if extra_labels:
            stream_labels.update(extra_labels)
        payload = {"streams": [{"stream": stream_labels, "values": [[str(time.time_ns()), line]]}]}
        async with httpx.AsyncClient() as client:
            response = await client.post(f"{LOKI_URL}/loki/api/v1/push", json=payload, timeout=10)
            response.raise_for_status()

    async def notify_admin(alert, alert_id):
        try:
            await push_alert_to_loki(alert, extra_labels={"pending_approval": "true", "alert_id": alert_id})
        except Exception as exc:
            logger.error(json.dumps({"event_type": "ai_admin_notify_loki_failed", "error": str(exc), "alert_id": alert_id}))
        if not ADMIN_WEBHOOK_URL:
            return
        payload = {"event": "pending_security_alert", "alert_id": alert_id, "severity": alert.severity, "attack_type": alert.attack_type, "mitre": alert.mitre, "summary": alert.summary, "affected_service": alert.affected_service, "source_ip": alert.source_ip, "confidence": alert.confidence, "recommended_playbook": alert.recommended_playbook, "evidence": alert.evidence[:3], "approve_hint": f"POST /pending/{alert_id}/approve", "dismiss_hint": f"POST /pending/{alert_id}/dismiss", "ts": alert.ts}
        async with httpx.AsyncClient() as client:
            response = await client.post(ADMIN_WEBHOOK_URL, json=payload, timeout=10)
            response.raise_for_status()

    def should_alert(result):
        return result.verdict != "normal" and SEVERITY_RANK[result.severity] >= SEVERITY_RANK.get(MIN_ALERT_SEVERITY, 2)

    def requires_admin_approval(result):
        return SEVERITY_RANK[result.severity] >= SEVERITY_RANK.get(ADMIN_APPROVAL_SEVERITY, 3)

    async def handle_logs(logs, source):
        result = await analyze_logs(logs)
        if not should_alert(result):
            return result
        alert = AlertRecord(provider=result.provider_used, model=result.model_used, source=source, verdict=result.verdict, severity=result.severity, confidence=result.confidence, attack_type=result.attack_type, mitre=result.mitre, summary=result.summary, evidence=result.evidence, recommended_action=result.recommended_action, recommended_playbook=result.recommended_playbook, affected_service=result.affected_service, source_ip=result.source_ip, log_count=len(logs), log_hash=_logs_hash(logs), ts=_now_iso())
        logger.warning(alert.model_dump_json())
        if requires_admin_approval(result):
            alert_id = str(uuid.uuid4())[:12]
            expires_ts = datetime.fromtimestamp(time.time() + PENDING_TTL_SECONDS, tz=timezone.utc).isoformat()
            PENDING_ALERTS[alert_id] = PendingAlert(alert_id=alert_id, alert=alert, created_at=_now_iso(), expires_at=expires_ts)
            logger.warning(json.dumps({"event_type": "ai_pending_alert_created", "alert_id": alert_id, "severity": alert.severity, "attack_type": alert.attack_type}))
            try:
                await notify_admin(alert, alert_id)
            except Exception as exc:
                logger.error(json.dumps({"event_type": "ai_admin_notify_failed", "error": str(exc), "alert_id": alert_id}))
        else:
            try:
                await push_alert_to_loki(alert)
            except Exception as exc:
                logger.error(json.dumps({"event_type": "ai_alert_push_failed", "error": str(exc)}))
        return result

    async def query_loki():
        end_ns = time.time_ns()
        start_ns = end_ns - LOOKBACK_SECONDS * 1_000_000_000
        params = {"query": LOKI_QUERY, "start": str(start_ns), "end": str(end_ns), "limit": str(MAX_LOGS_PER_BATCH), "direction": "backward"}
        async with httpx.AsyncClient() as client:
            response = await client.get(f"{LOKI_URL}/loki/api/v1/query_range", params=params, timeout=15)
            response.raise_for_status()
            data = response.json()
        entries = []
        for stream in data.get("data", {}).get("result", []):
            labels = {str(k): str(v) for k, v in stream.get("stream", {}).items()}
            for ts_ns, message in stream.get("values", []):
                entries.append(LogEntry(timestamp=ts_ns, message=message, labels=labels))
        entries.reverse()
        return entries[:MAX_LOGS_PER_BATCH]

    async def poll_loki_loop():
        seen_hashes = set()
        await asyncio.sleep(10)
        while True:
            try:
                logs = await query_loki()
                if logs:
                    batch_hash = _logs_hash(logs)
                    if batch_hash not in seen_hashes:
                        seen_hashes.add(batch_hash)
                        await handle_logs(logs, "loki")
                        if len(seen_hashes) > 500:
                            seen_hashes = set(list(seen_hashes)[-250:])
            except Exception as exc:
                logger.error(json.dumps({"event_type": "ai_loki_poll_failed", "error": str(exc)}))
            await asyncio.sleep(POLL_INTERVAL_SECONDS)

    async def expire_pending_loop():
        while True:
            await asyncio.sleep(60)
            now_ts = time.time()
            to_remove = []
            for alert_id, pending in list(PENDING_ALERTS.items()):
                if pending.status == "pending":
                    if now_ts >= datetime.fromisoformat(pending.expires_at).timestamp():
                        PENDING_ALERTS[alert_id] = pending.model_copy(update={"status": "expired", "reviewed_at": _now_iso(), "note": "Auto-expired"})
                elif pending.status in {"approved", "dismissed", "expired"}:
                    if pending.reviewed_at and now_ts - datetime.fromisoformat(pending.reviewed_at).timestamp() > 3600:
                        to_remove.append(alert_id)
            for alert_id in to_remove:
                del PENDING_ALERTS[alert_id]

    @app.on_event("startup")
    async def startup():
        if POLL_ENABLED:
            asyncio.create_task(poll_loki_loop())
        asyncio.create_task(expire_pending_loop())

    @app.get("/health")
    async def health():
        pending_count = sum(1 for p in PENDING_ALERTS.values() if p.status == "pending")
        active_provider = "heuristic"
        if AI_PROVIDER == "openai" and OPENAI_API_KEY:
            active_provider = "openai"
        elif AI_PROVIDER == "gemini" and GEMINI_API_KEY:
            active_provider = "gemini"
        return {"status": "ok", "service": APP_NAME, "provider": active_provider, "provider_chain": ["openai", "gemini", "heuristic"], "poll_enabled": POLL_ENABLED, "loki_url": LOKI_URL, "provider_backoff_remaining_seconds": _provider_cooldown_remaining(), "admin_approval_severity": ADMIN_APPROVAL_SEVERITY, "pending_alerts_count": pending_count, "admin_webhook_configured": bool(ADMIN_WEBHOOK_URL)}

    @app.post("/analyze", response_model=AnalyzeResult)
    async def analyze(request: AnalyzeRequest):
        return await handle_logs(request.logs[:MAX_LOGS_PER_BATCH], request.source)

    @app.get("/pending", response_model=list[PendingAlert])
    async def list_pending(status: str | None = None):
        alerts = list(PENDING_ALERTS.values())
        if status:
            alerts = [a for a in alerts if a.status == status]
        alerts.sort(key=lambda a: a.created_at, reverse=True)
        return alerts

    @app.get("/pending/{alert_id}", response_model=PendingAlert)
    async def get_pending(alert_id: str):
        pending = PENDING_ALERTS.get(alert_id)
        if not pending:
            raise HTTPException(status_code=404, detail=f"Alert {alert_id!r} not found")
        return pending

    @app.post("/pending/{alert_id}/approve", response_model=PendingAlert)
    async def approve_pending(alert_id: str, body: ApproveRequest = ApproveRequest()):
        pending = PENDING_ALERTS.get(alert_id)
        if not pending:
            raise HTTPException(status_code=404, detail=f"Alert {alert_id!r} not found")
        if pending.status != "pending":
            raise HTTPException(status_code=409, detail=f"Alert is already {pending.status!r}")
        updated = pending.model_copy(update={"status": "approved", "reviewed_at": _now_iso(), "note": body.note or "Approved by admin"})
        PENDING_ALERTS[alert_id] = updated
        logger.warning(json.dumps({"event_type": "ai_pending_alert_approved", "alert_id": alert_id, "severity": pending.alert.severity, "attack_type": pending.alert.attack_type}))
        try:
            await forward_alert_to_soar(pending.alert)
        except Exception as exc:
            logger.error(json.dumps({"event_type": "ai_soar_forward_failed", "error": str(exc), "alert_id": alert_id}))
            raise HTTPException(status_code=502, detail=f"SOAR forward failed: {exc}")
        return updated

    @app.post("/pending/{alert_id}/dismiss", response_model=PendingAlert)
    async def dismiss_pending(alert_id: str, body: DismissRequest = DismissRequest()):
        pending = PENDING_ALERTS.get(alert_id)
        if not pending:
            raise HTTPException(status_code=404, detail=f"Alert {alert_id!r} not found")
        if pending.status != "pending":
            raise HTTPException(status_code=409, detail=f"Alert is already {pending.status!r}")
        updated = pending.model_copy(update={"status": "dismissed", "reviewed_at": _now_iso(), "note": body.note or "Dismissed by admin"})
        PENDING_ALERTS[alert_id] = updated
        logger.warning(json.dumps({"event_type": "ai_pending_alert_dismissed", "alert_id": alert_id, "severity": pending.alert.severity, "attack_type": pending.alert.attack_type}))
        return updated
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer
  namespace: plg-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-analyzer
  template:
    metadata:
      labels:
        app: ai-analyzer
    spec:
      containers:
        - name: ai-analyzer
          image: ztlab/ai-analyzer:1.2.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ai-secrets
                optional: true
          env:
            - name: LOKI_URL
              value: http://loki.plg-stack.svc.cluster.local:3100
            - name: SOAR_WEBHOOK_URL
              value: http://soar-engine.plg-stack.svc.cluster.local:8080/alerts
            - name: AI_ANALYZER_POLL_ENABLED
              value: "false"
            - name: AI_ANALYZER_POLL_INTERVAL_SECONDS
              value: "120"
            - name: AI_ANALYZER_LOOKBACK_SECONDS
              value: "300"
            - name: AI_ANALYZER_MAX_LOGS_PER_BATCH
              value: "10"
            - name: AI_ANALYZER_MIN_ALERT_SEVERITY
              value: medium
            - name: AI_ANALYZER_ADMIN_APPROVAL_SEVERITY
              value: high
            - name: AI_ANALYZER_PENDING_TTL_SECONDS
              value: "3600"
            - name: AI_PROVIDER_COOLDOWN_SECONDS
              value: "900"
            - name: AI_ANALYZER_LOKI_QUERY
              value: '{job=~"envoy-access|opa-decisions|kubernetes-pods"} |~ "(?i)(403|401|denied|fraud_gate_bypass|lateral|xmrig|cryptomin|port.scan|nmap|bytes_sent|large_response|unauthorized|svid|spiffe)"'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: main-patch
              mountPath: /app/main.py
              subPath: main.py
      volumes:
        - name: main-patch
          configMap:
            name: ai-analyzer-patch
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyzer
  namespace: plg-stack
spec:
  selector:
    app: ai-analyzer
  ports:
    - name: http
      port: 8080
      targetPort: http
