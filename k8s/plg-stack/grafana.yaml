apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: plg-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: plg-stack
spec:
  replicas: 1
  # Phần 3.6 remediation (2026-09-19) — cùng lý do đã sửa ở loki.yaml: PVC
  # grafana-data-pvc là ReadWriteOnce, RollingUpdate mặc định có thể deadlock
  # (pod mới kẹt Pending chờ volume, pod cũ không bị xoá vì pod mới chưa
  # Ready) khi node ít tài nguyên trống — verify sống đúng bug này ở loki.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            # Phần 3.7 remediation (2026-09-19) — trước đây hardcode plaintext
            # "ZTALab2026!" thẳng trong file này (không Secret nào cả, dù
            # .env.template đã có sẵn GRAFANA_ADMIN_PASSWORD, đúng ý định thiết
            # kế chỉ là chưa nối dây). Nay đọc từ Secret grafana-admin-secret
            # (scripts/deploy-app.sh ensure, cùng mẫu keycloak-secret).
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin-secret, key: admin-user } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin-secret, key: admin-password } }
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ALERTING_ENABLED
              value: "true"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            # SMTP (đóng sổ 2026-10-04): trỏ vào MailHog plg-stack — hộp thư SOC của lab, cùng nơi incident-analyzer
            # gửi evidence bundle (H9: test double có chủ đích). Bản cũ trỏ smtp.gmail.com:587 với mật khẩu lấy từ
            # grafana-smtp-secret — trên cụm dựng 2026-10-04 secret rỗng → MỌI email của Grafana thất bại "535 Username
            # and Password not accepted" (đo qua API receivers): các alert category=infrastructure (Mesh Integrity,
            # Control-Plane Down, Log Pipeline Silent, Health-Check Silent) Firing đúng nhưng chưa từng báo tới ai (H7 ca 6).
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: "mailhog.plg-stack.svc.cluster.local:1025"
            - name: GF_SMTP_FROM_ADDRESS
              value: "grafana@ztlab.local"
            - name: GF_SMTP_FROM_NAME
              value: "ZTLab Security Monitor"
            - name: GF_SMTP_STARTTLS_POLICY
              value: "NoStartTLS"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-alerting
          configMap:
            name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: plg-stack
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
