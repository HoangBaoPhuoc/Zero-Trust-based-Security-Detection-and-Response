apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: plg-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: plg-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: plg-stack
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/promtail-positions/positions.yaml

    clients:
      - url: ${LOKI_PUSH_URL}
        batchwait: 1s
        batchsize: 1048576

    scrape_configs:

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            api_server: https://10.10.1.10:6443
            tls_config:
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: keep
            regex: ${NODE_NAME}
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: financial|identity|plg-stack
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app_kubernetes_io_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service_name
          - target_label: job
            replacement: kubernetes-pods
          - target_label: cloud
            replacement: ${CLOUD_PROVIDER}
          - target_label: env
            replacement: ztlab
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            regex: (.+)/(.+)
            replacement: /var/log/pods/*$1/$2/*.log

      # Envoy sidecar access logs — collected from kubernetes-pods stdout (JSON format)
      - job_name: envoy-access-k8s
        kubernetes_sd_configs:
          - role: pod
            api_server: https://10.10.1.10:6443
            tls_config:
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                timestamp: timestamp
                method: method
                path: path
                response_code: response_code
                response_time: response_time
                upstream: upstream
                source_ip: source_ip
                bytes_sent: bytes_sent
                trace_id: trace_id
                svid: svid
          - labels:
              method:
              path:
              response_code:
              source_ip:
          - timestamp:
              source: timestamp
              format: RFC3339
              action_on_failure: skip
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: keep
            regex: ${NODE_NAME}
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: financial
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: envoy
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service_name
          - target_label: job
            replacement: envoy-access
          - target_label: cloud
            replacement: ${CLOUD_PROVIDER}
          - target_label: env
            replacement: ztlab
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            regex: (.+)/(.+)
            replacement: /var/log/pods/*$1/$2/*.log

      # OPA decision logs — collected from opa container stdout (decision_logs: console: true)
      - job_name: opa-decisions-k8s
        kubernetes_sd_configs:
          - role: pod
            api_server: https://10.10.1.10:6443
            tls_config:
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                decision_id: decision_id
                opa_result: result
          - labels:
              opa_result:
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: keep
            regex: ${NODE_NAME}
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: financial
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: opa
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: job
            replacement: opa-decisions
          - target_label: cloud
            replacement: ${CLOUD_PROVIDER}
          - target_label: env
            replacement: ztlab
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            regex: (.+)/(.+)
            replacement: /var/log/pods/*$1/$2/*.log

      - job_name: system-aws
        static_configs:
          - targets: ["localhost"]
            labels:
              job: "system"
              cloud: "aws"
              env: "ztlab"
              __path__: /var/log/syslog
        pipeline_stages:
          - regex:
              expression: '^(?P<timestamp>\S+\s+\S+\s+\S+) (?P<hostname>\S+) (?P<program>[^\[:]+)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'
          - labels:
              program:
          - output:
              source: message
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: plg-stack
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          args: ["-config.file=/etc/promtail/promtail-config.yml", "-config.expand-env=true"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOKI_PUSH_URL
              value: http://loki.plg-stack.svc.cluster.local:3100/loki/api/v1/push
            - name: CLOUD_PROVIDER
              value: aws
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail/promtail-config.yml
              subPath: promtail-config.yml
              readOnly: true
            - name: positions
              mountPath: /tmp/promtail-positions
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: envoy-logs
              mountPath: /var/log/envoy
              readOnly: true
            - name: opa-logs
              mountPath: /var/log/opa
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: envoy-logs
          hostPath:
            path: /var/log/envoy
            type: DirectoryOrCreate
        - name: opa-logs
          hostPath:
            path: /var/log/opa
            type: DirectoryOrCreate
