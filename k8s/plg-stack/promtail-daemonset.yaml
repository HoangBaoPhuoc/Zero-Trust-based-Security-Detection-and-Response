apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: plg-stack
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          args: ["-config.file=/etc/promtail/promtail-config.yml"]
