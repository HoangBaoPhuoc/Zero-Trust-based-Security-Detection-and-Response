- name: Verify K3s services after deployment
  hosts: aws_k3s_master:aws_k3s_worker_1:aws_k3s_worker_2:os_k3s_master:os_k3s_worker_1:os_k3s_worker_2
  become: true
  gather_facts: false
  tasks:
    - name: Check K3s service state on each node
      ansible.builtin.shell: |
        if systemctl list-unit-files | grep -q '^k3s\.service'; then
          systemctl is-active k3s
        else
          systemctl is-active k3s-agent
        fi
      register: k3s_state
      changed_when: false

    - name: Assert K3s service is active
      ansible.builtin.assert:
        that:
          - k3s_state.stdout == 'active'
        fail_msg: "K3s service is not active on {{ inventory_hostname }}"
