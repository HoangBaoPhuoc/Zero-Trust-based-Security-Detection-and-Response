---
- name: WireGuard VPN Setup
  hosts: aws_gateway,os_gateway
  become: true
  vars:
    wg_interface: wg0
    wg_subnet: 10.200.0.0/24
    wg_listen_port: 51820
    aws_gateway_ip: 10.200.0.1
    os_gateway_ip: 10.200.0.2

  pre_tasks:
    - name: Gather AWS gateway EIP
      ansible.builtin.set_fact:
        aws_gateway_eip: "{{ hostvars.aws_gateway.ansible_host }}"
      when: inventory_hostname in ['aws_gateway', 'os_gateway']
      run_once: true

    - name: Detect primary outgoing interface
      ansible.builtin.shell: |
        ip route show default | awk '{print $5}' | head -1
      register: primary_interface_detect
      changed_when: false
    
    - name: Set primary interface as fact
      ansible.builtin.set_fact:
        primary_interface: "{{ primary_interface_detect.stdout | trim }}"

  tasks:
    - name: Ensure WireGuard is installed
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
        state: present
      register: wg_install
      failed_when: wg_install is failed and "No package matching 'wireguard'" not in wg_install.msg | default("")
      when: ansible_os_family == "Debian"

    - name: Ensure WireGuard configuration directory exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check if WireGuard private key exists
      ansible.builtin.stat:
        path: /etc/wireguard/privatekey
      register: wg_private_key_stat

    - name: Check if WireGuard public key exists
      ansible.builtin.stat:
        path: /etc/wireguard/publickey
      register: wg_public_key_stat

    - name: Generate WireGuard keypair if missing or empty
      ansible.builtin.shell: |
        set -e
        wg genkey | tee /etc/wireguard/privatekey | wg pubkey > /etc/wireguard/publickey
        chmod 600 /etc/wireguard/privatekey
        chmod 644 /etc/wireguard/publickey
      when: >
        not wg_private_key_stat.stat.exists
        or wg_private_key_stat.stat.size | default(0) == 0
        or not wg_public_key_stat.stat.exists
        or wg_public_key_stat.stat.size | default(0) == 0
      changed_when: true

    - name: Read WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/privatekey
      register: wg_private_key_content

    - name: Read WireGuard public key
      ansible.builtin.slurp:
        src: /etc/wireguard/publickey
      register: wg_public_key_content

    - name: Set WireGuard private and public keys as facts
      ansible.builtin.set_fact:
        wg_private_key: "{{ wg_private_key_content.content | b64decode | trim }}"
        wg_public_key: "{{ wg_public_key_content.content | b64decode | trim }}"
      no_log: true

    - name: Deploy AWS gateway wg0.conf
      ansible.builtin.template:
        src: ../templates/wg0-aws-gateway.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        peer_public_key: "{{ hostvars['os_gateway']['wg_public_key'] }}"
        gateway_ip: "{{ aws_gateway_ip }}"
        primary_interface: "{{ primary_interface }}"
      when: inventory_hostname == 'aws_gateway'
      notify: restart wg-quick

    - name: Deploy OS gateway wg0.conf
      ansible.builtin.template:
        src: ../templates/wg0-os-gateway.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        peer_public_key: "{{ hostvars['aws_gateway']['wg_public_key'] }}"
        gateway_ip: "{{ os_gateway_ip }}"
        peer_endpoint: "{{ aws_gateway_eip }}:{{ wg_listen_port }}"
        primary_interface: "{{ primary_interface }}"
      when: inventory_hostname == 'os_gateway'
      notify: restart wg-quick

    - name: Enable IPv4 forwarding (sysctl)
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Enable WireGuard service
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        enabled: true
        daemon_reload: true

    - name: Restart WireGuard service to apply latest config
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted

    - name: Apply pending WireGuard config changes before validation
      ansible.builtin.meta: flush_handlers

    - name: Wait for WireGuard interface to be ready
      ansible.builtin.pause:
        seconds: 3

    - name: Verify WireGuard interface is up
      ansible.builtin.command: ip addr show {{ wg_interface }}
      register: wg_interface_check
      changed_when: false
      failed_when: wg_interface not in wg_interface_check.stdout

    - name: Display WireGuard status
      ansible.builtin.command: wg show {{ wg_interface }}
      register: wg_status
      changed_when: false

    - name: Show WireGuard peer status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout }}"

    - name: Test WireGuard tunnel connectivity
      ansible.builtin.command: ping -I {{ wg_interface }} -c 3 "{% if inventory_hostname == 'aws_gateway' %}{{ os_gateway_ip }}{% else %}{{ aws_gateway_ip }}{% endif %}"
      register: wg_tunnel_test
      changed_when: false
      until: wg_tunnel_test.rc == 0
      retries: 5
      delay: 4

    - name: Confirm WireGuard tunnel is operational
      ansible.builtin.debug:
        msg: "WireGuard tunnel from {{ inventory_hostname }} is operational"

  handlers:
    - name: restart wg-quick
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
        daemon_reload: true
