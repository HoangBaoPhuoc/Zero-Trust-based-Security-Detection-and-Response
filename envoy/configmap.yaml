apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: financial
data:
  envoy-sidecar.yaml: |
    static_resources:
      listeners:
        - name: inbound_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15006
      clusters:
        - name: local_service
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: local_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
  envoy-aws.yaml: |
    static_resources:
      clusters:
        - name: upstream_service
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: upstream_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: payment-service.financial.svc.cluster.local
                          port_value: 8080
  envoy-os.yaml: |
    static_resources:
      clusters:
        - name: upstream_service
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: upstream_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: core-banking.financial.svc.cluster.local
                          port_value: 8080

