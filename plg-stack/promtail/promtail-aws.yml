server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.10.2.10:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          cluster: aws
          host: ${HOSTNAME}
          __path__: /var/log/syslog

  - job_name: envoy
    static_configs:
      - targets: [localhost]
        labels:
          job: envoy
          cluster: aws
          host: ${HOSTNAME}
          __path__: /var/log/envoy/access.log

  - job_name: opa
    static_configs:
      - targets: [localhost]
        labels:
          job: opa
          cluster: aws
          host: ${HOSTNAME}
          __path__: /var/log/opa/decisions.json
