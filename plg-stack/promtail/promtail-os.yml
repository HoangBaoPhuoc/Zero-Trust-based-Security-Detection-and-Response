server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions/positions.yaml

clients:
  - url: http://10.10.2.10:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: envoy-access-openstack
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "envoy-access"
          cloud: "openstack"
          env: "ztlab"
          __path__: /var/log/envoy/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            method: method
            path: path
            response_code: response_code
            response_time: response_time
            upstream: upstream
            source_ip: source_ip
            bytes_sent: bytes_sent
            trace_id: trace_id
            user_id: user_id
            svid: svid
      - labels:
          method:
          path:
          response_code:
          source_ip:
      - timestamp:
          source: timestamp
          format: RFC3339
          action_on_failure: skip

  - job_name: opa-decisions-openstack
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "opa-decisions"
          cloud: "openstack"
          env: "ztlab"
          __path__: /var/log/opa/decisions.json
    pipeline_stages:
      - json:
          expressions:
            decision_id: decision_id
            opa_result: result.allow
            deny_reason: result.deny_reason
            path: input.attributes.request.http.path
            source_svid: input.source.principal
      - labels:
          opa_result:
          deny_reason:
          path:
          source_svid:

  - job_name: system-openstack
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "system"
          cloud: "openstack"
          env: "ztlab"
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+\s+\S+) (?P<hostname>\S+) (?P<program>[^\[:]+)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'
      - labels:
          program:
      - output:
          source: message
