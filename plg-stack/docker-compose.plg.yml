services:
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - plg

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/alerting:/etc/grafana/provisioning/alerting
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - plg

  ai-analyzer:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ai-analyzer
      network: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8090"]
    network_mode: host
    depends_on:
      - loki
      - soar-engine
    env_file:
      - path: ../.env.ai
        required: false
    environment:
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3100}
      SOAR_WEBHOOK_URL: ${SOAR_WEBHOOK_URL:-http://127.0.0.1:8091/alerts}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      AI_ANALYZER_POLL_ENABLED: ${AI_ANALYZER_POLL_ENABLED:-true}
      AI_ANALYZER_POLL_INTERVAL_SECONDS: ${AI_ANALYZER_POLL_INTERVAL_SECONDS:-30}
      AI_ANALYZER_LOOKBACK_SECONDS: ${AI_ANALYZER_LOOKBACK_SECONDS:-90}
      AI_ANALYZER_MAX_LOGS_PER_BATCH: ${AI_ANALYZER_MAX_LOGS_PER_BATCH:-25}
      AI_ANALYZER_MIN_ALERT_SEVERITY: ${AI_ANALYZER_MIN_ALERT_SEVERITY:-medium}
      AI_ANALYZER_LOKI_QUERY: ${AI_ANALYZER_LOKI_QUERY:-{job=~"kubernetes-pods|envoy-access|opa-decisions|system|demo-raw"}}
      SOAR_API_TOKEN: ${SOAR_API_TOKEN:-}
    restart: unless-stopped

  soar-engine:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: soar-engine
      network: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8091"]
    network_mode: host
    depends_on:
      - loki
    env_file:
      - path: ../.env.ai
        required: false
    environment:
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3100}
      SOAR_DRY_RUN: ${SOAR_DRY_RUN:-true}
      SOAR_AUTO_EXECUTE: ${SOAR_AUTO_EXECUTE:-true}
      SOAR_MIN_SEVERITY: ${SOAR_MIN_SEVERITY:-high}
      SOAR_MIN_CONFIDENCE: ${SOAR_MIN_CONFIDENCE:-0.70}
      SOAR_NAMESPACE: ${SOAR_NAMESPACE:-financial}
      SOAR_ALLOWED_CONTEXTS: ${SOAR_ALLOWED_CONTEXTS:-ctx-aws,ctx-openstack}
      SOAR_API_TOKEN: ${SOAR_API_TOKEN:-}
      SOAR_CASE_STORE_PATH: ${SOAR_CASE_STORE_PATH:-/data/cases.jsonl}
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
      - soar-data:/data
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  soar-data:

networks:
  plg:
    driver: bridge
