services:
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - plg

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/alerting:/etc/grafana/provisioning/alerting
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - plg

  ai-analyzer:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ai-analyzer
      network: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8090"]
    network_mode: host
    depends_on:
      - loki
      - soar-engine
    env_file:
      - path: ../.env.ai
        required: false
    environment:
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3100}
      SOAR_WEBHOOK_URL: ${SOAR_WEBHOOK_URL:-http://127.0.0.1:8091/alerts}
      AI_ANALYZER_LOKI_QUERY: ${AI_ANALYZER_LOKI_QUERY:-{job=~"kubernetes-pods|envoy-access|opa-decisions|system|demo-raw"}}
    restart: unless-stopped

  soar-engine:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: soar-engine
      network: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8091"]
    network_mode: host
    depends_on:
      - loki
    env_file:
      - path: ../.env.ai
        required: false
    environment:
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3100}
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
      - soar-data:/data
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  soar-data:

networks:
  plg:
    driver: bridge
