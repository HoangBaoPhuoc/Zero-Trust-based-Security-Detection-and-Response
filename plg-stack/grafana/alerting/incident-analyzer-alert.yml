apiVersion: 1

groups:
  - orgId: 1
    name: incident-analyzer
    folder: ZTLab
    interval: 1m
    rules:
      - uid: incident-analyzer-health-alert
        title: "Incident Analyzer — Health Check (Evidence Bundle Produced)"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: 'count_over_time({job="incident-analyzer"} |= "evidence_bundle" [10m])'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Incident Analyzer is producing evidence bundles"
          description: "Informational — confirms the incident-analyzer received alerts and packaged evidence. This system takes no automated response action."
        labels:
          severity: info
          category: health
