apiVersion: 1

groups:
  - orgId: 1
    name: lateral-movement
    folder: ZTLab
    interval: 1m
    rules:
      - uid: lateral-movement-svid
        title: "Lateral Movement — Invalid SVID Pair Detected"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: '{job="opa-decisions"} | json | opa_result=`false` | deny_reason=`svid_mismatch`'
              instant: false
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "OPA denied request with SVID mismatch — possible lateral movement"
          description: "ATT&CK T1021.007. Check OPA Decision Log dashboard."
        labels:
          severity: critical
          mitre: T1021.007
