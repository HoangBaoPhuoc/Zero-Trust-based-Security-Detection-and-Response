apiVersion: 1

groups:
  - orgId: 1
    name: lateral-movement
    folder: ZTLab
    interval: 1m
    rules:
      - uid: lateral-movement-svid
        title: "Kịch bản 2 — Lateral Movement: Invalid SVID"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: '{job="opa-decisions",opa_result="false"}'
              instant: false
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "OPA từ chối request — SVID không hợp lệ, có thể lateral movement"
          description: "ATT&CK T1021.007 — Service cố truy cập service khác với SPIFFE ID sai. mTLS bị vi phạm."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Ghi OPA denial vào case với severity=critical
            2. Revoke token của service account vi phạm
            3. Cảnh báo SPIRE agent để audit SVID chain
            🔧 Admin cần xem xét: kubectl logs -n financial deployment/api-gateway -c envoy
        labels:
          severity: critical
          category: security
          mitre: T1021.007
