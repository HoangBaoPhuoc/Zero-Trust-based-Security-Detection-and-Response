apiVersion: 1

groups:
  - orgId: 1
    name: lateral-movement
    folder: ZTLab
    interval: 1m
    rules:
      - uid: lateral-movement-svid
        title: "Kịch bản 2 — Lateral Movement: Invalid SVID"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: '{job="opa-decisions",opa_result="false"}'
              instant: false
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Lateral Movement — OPA chặn service call không có SVID hợp lệ (T1021.007)"
          description: "OPA deny: service gọi /payments/internal/execute hoặc /transactions/execute với SVID không được phép. Kiểm tra: kubectl logs -n financial deployment/payment-service -c envoy | grep payments/internal"
        labels:
          severity: critical
          category: security
          mitre: T1021.007
          attack_type: lateral_movement
