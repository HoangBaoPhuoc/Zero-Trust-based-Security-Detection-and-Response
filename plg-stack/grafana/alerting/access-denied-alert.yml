apiVersion: 1

# crAPI (KE-HOACH-CRAPI.md Phase 7). Tín hiệu: OPA từ chối (lateral movement,
# RBAC, step-up, posture, device-trust) — decision log `zta/crapi/authz/allow`
# result:false, scrape bởi promtail job `opa-decisions` (đã có cho ns crapi).
groups:
  - orgId: 1
    name: access-denied
    folder: ZTLab
    interval: 1m
    rules:
      - uid: access-denied-opa-crapi
        title: "crAPI — Access Denied Spike (OPA ext_authz từ chối)"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Loki
            model:
              datasource: { type: loki, uid: Loki }
              expr: 'sum(count_over_time({job="opa-decisions", opa_result="false"} [10m]))'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Nhiều request bị OPA từ chối trong ns crapi (RBAC / lateral movement / step-up / posture)"
          description: >
            OPA `zta/crapi/authz/allow` trả result:false vượt ngưỡng. Có thể là:
            RBAC (crapi-user cố gọi endpoint admin), lateral movement (crapi-community
            gọi crapi-workshop path ngoài service_acl), step-up chưa đạt, hoặc
            device-posture/trust non-compliant.
          recommended_response: |
            🔎 Đề xuất cho người vận hành: chặn IP nguồn / cô lập workload (thủ công — không tự thực thi)
            🔧 Bằng chứng: Grafana → ZTLab → Incident Evidence Dashboard
        labels:
          severity: high
          category: security
          attack_type: access_denied
