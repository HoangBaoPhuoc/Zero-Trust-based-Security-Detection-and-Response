apiVersion: 1

groups:
  - orgId: 1
    name: access-denied
    folder: ZTLab
    interval: 1m
    rules:
      - uid: access-denied-opa-rbac
        title: "Kịch bản 5 — Access Denied Spike (T1078) — OPA RBAC"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              # Verified 2026-08-23 (post-Istio migration): tests/grafana_kb5_access_denied.sh's
              # actual attack request goes through `kubectl port-forward svc/api-gateway`
              # ($GW_URL), which bypasses Istio's sidecar interception entirely (see
              # brute-force-alert.yml's identical finding + full writeup in
              # FLOW_DETAIL.md §2.3/§4). OPA is never called for this path — api-gateway's
              # OWN role check (services/api-gateway/main.py:_require_role) rejects it
              # first, logging {event:"authz_denied", required_role, user, source_ip}.
              # Confirmed via direct log capture (server: uvicorn, not istio-envoy, on
              # the HTTP response). The old job="opa-decisions" query never matched real
              # traffic for this test scenario either, in both the pre- and post-Istio
              # architecture.
              expr: 'sum(count_over_time({namespace="financial",app="api-gateway"} | json | event="authz_denied" [10m]))'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "OPA RBAC từ chối POST /payments — user thiếu financial-write role (T1078)"
          description: "ATT&CK T1078 — merchant01 cố gắng thực hiện POST /payments với role financial-read. OPA từ chối: thiếu financial-write. Có thể là tài khoản bị compromise hoặc privilege escalation."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Block IP nguồn tấn công (Redis blocklist, 24h TTL)
            2. Tạo case với playbook block_source_ip
            3. Notify admin để review merchant account
            🔧 Admin cần xem xét: Grafana → ZTLab → SOAR Cases
        labels:
          severity: high
          category: security
          mitre: T1078
          attack_type: access_denied
