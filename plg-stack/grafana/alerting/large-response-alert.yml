apiVersion: 1

groups:
  - orgId: 1
    name: gap1-exfiltration
    folder: ZTLab
    interval: 1m
    rules:
      - uid: gap1-large-response
        title: "Kịch bản 4 — Data Exfiltration Suspect (Gap 1)"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: 'sum(count_over_time({job="envoy-access"} | json | bytes_sent > 1048576 [5m]))'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Nhiều request bulk data >5KB từ api-gateway — nghi ngờ data exfiltration"
          description: "ATT&CK T1041 — Nhiều request lấy dữ liệu giao dịch/tài khoản với response >5KB trong 5 phút. Log thật từ api-gateway trace_middleware bytes_sent."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Ghi alert vào case với evidence từ Loki
            2. Tăng anomaly score cho service liên quan
            3. Notify admin để manual review
            🔧 Admin cần xem xét:
            - Grafana → api-gateway logs → filter bytes_sent > 5000
        labels:
          severity: high
          category: security
          gap: gap1
          mitre: T1041
          attack_type: large_response
