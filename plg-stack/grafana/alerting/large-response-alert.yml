apiVersion: 1

groups:
  - orgId: 1
    name: large-response
    folder: ZTLab
    interval: 1m
    rules:
      - uid: large-response
        title: Large Response Detected
        condition: A
        data:
          - refId: A
            datasourceUid: Loki
            model:
              expr: '{job="envoy"} |= "bytes_sent"'
