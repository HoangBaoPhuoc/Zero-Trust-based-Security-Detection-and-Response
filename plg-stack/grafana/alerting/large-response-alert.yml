apiVersion: 1

groups:
  - orgId: 1
    name: gap1-exfiltration
    folder: ZTLab
    interval: 1m
    rules:
      - uid: gap1-large-response
        title: "Kịch bản 4 — Data Exfiltration Suspect (Gap 1)"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: '{job="envoy-access", cloud="openstack"} | json | bytes_sent > 1048576'
              instant: false
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Response >1MB từ OpenStack — nghi ngờ data exfiltration"
          description: "ATT&CK T1041 — Gap 1: Envoy log từ OpenStack có bytes_sent vượt ngưỡng 1MB. Có thể đang dump database hoặc exfiltrate file."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Ghi alert vào case với evidence từ Loki
            2. Tăng anomaly score cho service liên quan
            3. Notify admin để manual review
            🔧 Admin cần xem xét:
            - kubectl logs -n financial deployment/core-banking | grep bytes_sent
            - Kiểm tra OpenStack Security Group rules
            - Xem xét rate-limit response size tại Envoy
        labels:
          severity: high
          category: security
          gap: gap1
          mitre: T1041
