apiVersion: 1

groups:
  - orgId: 1
    name: security-scorer
    folder: ZTLab
    interval: 1m
    rules:

      # Fires when anomaly score (Redis 15-minute window) exceeds 70 (high risk)
      - uid: anomaly-score-high-alert
        title: "[ZTLab] Kịch bản 5 — Anomaly Score Cao (>=70)"
        for: 2m
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              expr: "ztlab_anomaly_score"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 70
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Kịch bản 5 — AI Anomaly Score CRITICAL (>=70): hành vi bất thường nghiêm trọng"
          description: "ATT&CK T1071 — Redis Security Scorer ghi nhận điểm nguy hiểm cao. Score >= 70 biểu hiện nhiều pattern tấn công đồng thời."
          soar_action: |
            SOAR tự động: Kích hoạt full_investigation, snapshot Loki 30 phút, revoke session user có score cao nhất.
            Admin: Grafana → ZTLab Security Overview → AI Anomaly
        labels:
          severity: critical
          category: security
          mitre: T1071
          attack_type: brute_force

      # Fires when anomaly score reaches medium level (40-70)
      - uid: anomaly-score-medium-alert
        title: "[ZTLab] Anomaly Score Trung Bình — Score >= 40"
        for: 5m
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              expr: "ztlab_anomaly_score"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 40
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Kịch bản 5b — AI Anomaly Score HIGH (40-70): cần theo dõi"
          description: "ATT&CK T1071 — AI Analyzer phát hiện pattern khả nghi mức trung bình. Theo dõi 15 phút tiếp theo."
          soar_action: |
            SOAR tự động: Tạo case priority=medium, ghi snapshot metrics, watchlist IP/user liên quan.
            Admin: Grafana → AI Analyzer dashboard
        labels:
          severity: high
          category: security
          mitre: T1071
          attack_type: access_denied

      # Fires when fraud gate blocks more than 3 transactions in 5 minutes
      - uid: fraud-gate-block-alert
        title: "[ZTLab] Nhiều Giao Dịch Bị Fraud Block"
        for: 0s
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: 'count_over_time({namespace="financial"} |= "fraud_gate_bypass" [5m])'
              instant: true
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Nhiều giao dịch bị fraud block trong 5 phút"
          description: "ATT&CK T1078.004 — Fraud detection chặn >3 giao dịch trong 5 phút. Có thể đang dùng card ăn cắp hoặc ATO."
          soar_action: |
            SOAR tự động: Block account liên quan tạm thời, flag transaction IDs vào Redis, tạo case fraud_response.
            Admin: Grafana → Fraud Gate dashboard
        labels:
          severity: high
          category: security
          mitre: T1078.004
          attack_type: fraud_gate_bypass
