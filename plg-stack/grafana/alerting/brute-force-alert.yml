apiVersion: 1

# crAPI (KE-HOACH-CRAPI.md Phase 7). crAPI challenge: brute-force OTP
# (/identity/api/auth/v3/check-otp) + brute-force login. crapi-identity log
# "Invalid Credentials" / OTP fail. Scrape: promtail job kubernetes-pods
# (namespace crapi, app crapi-identity).
groups:
  - orgId: 1
    name: brute-force
    folder: ZTLab
    interval: 1m
    rules:
      - uid: brute-force-crapi-identity
        title: "crAPI — Brute Force (login / OTP) trên crapi-identity"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Loki
            model:
              datasource: { type: loki, uid: Loki }
              expr: >
                sum(count_over_time(
                  {namespace="crapi", app="crapi-identity"}
                  |~ "(?i)(invalid credentials|invalid otp|bad credentials|otp.*(invalid|expired|mismatch))" [5m])) > 10
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Nhiều lần đăng nhập/OTP thất bại trên crapi-identity (brute force)"
          description: >
            ATT&CK T1110 — brute-force credential/OTP. crAPI có sẵn challenge OTP
            brute-force (/identity/api/auth/v3/check-otp). Ngưỡng >10 lỗi/5 phút.
          soar_action: |
            ✅ SOAR đề xuất: revoke_user_sessions + block_source_ip
        labels:
          severity: high
          category: security
          mitre: T1110
          attack_type: brute_force
