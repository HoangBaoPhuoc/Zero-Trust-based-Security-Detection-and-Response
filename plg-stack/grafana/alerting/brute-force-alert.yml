apiVersion: 1

groups:
  - orgId: 1
    name: brute-force
    folder: ZTLab
    interval: 1m
    rules:
      - uid: brute-force-login
        title: "Kịch bản 1 — Brute Force Login Detected"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: 'sum by (source_ip) (count_over_time({job="envoy-access", response_code="403"}[5m])) > 10'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Brute force login — hơn 10 lần 403 từ cùng source_ip trong 5 phút"
          description: "ATT&CK T1110.001 — Kẻ tấn công gửi nhiều request với JWT không hợp lệ. Envoy/OPA trả về 403 (JWT bị từ chối bởi OPA ext_authz)."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Block IP nguồn tấn công (Redis blocklist, 24h TTL)
            2. Revoke session Keycloak của user bị nhắm tới
            3. Ghi case vào /data/cases.jsonl
            🔧 Admin cần xem xét: Grafana → ZTLab → SOAR Cases
        labels:
          severity: high
          category: security
          mitre: T1110.001
          attack_type: brute_force
