apiVersion: 1

groups:
  - orgId: 1
    name: brute-force
    folder: ZTLab
    interval: 1m
    rules:
      - uid: brute-force-login
        title: "Brute Force Login Attempt Detected"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: 'sum by (source_ip) (count_over_time({job="envoy-access"} | json | response_code=`401` [1m]))'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Brute force login detected — >5 x 401 in 1m from same source_ip"
          description: "ATT&CK T1110.001. Check OPA decision logs for blocked identity."
        labels:
          severity: high
          mitre: T1110.001
