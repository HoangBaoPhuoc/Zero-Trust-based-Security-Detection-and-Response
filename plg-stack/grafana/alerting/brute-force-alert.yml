apiVersion: 1

groups:
  - orgId: 1
    name: brute-force
    folder: ZTLab
    interval: 1m
    rules:
      - uid: brute-force-login
        title: "Kịch bản 1 — Brute Force Login Detected"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              # Verified 2026-08-23 (post-Istio migration): a malformed/invalid
              # bearer token never reaches OPA's ext_authz check at all — Istio's
              # CUSTOM AuthorizationPolicy's RBAC→ext_authz bridge simply isn't
              # triggered for this case (confirmed via zero OPA decision-log
              # entries for repeated /payments calls with a garbage token, both
              # with a structurally-invalid string and a well-formed-but-
              # unsigned fake JWT). api-gateway's OWN JWT decode
              # (services/api-gateway/main.py) is what actually rejects these —
              # logging {event:"jwt_verification_failed", reason, source_ip} —
              # confirmed via direct log capture. This was ALREADY the real
              # mechanism before the Istio migration too (see FLOW_DETAIL.md
              # §4's own note that a 2026-06-28 doc revision describing an
              # Envoy/OPA-layer block for this exact scenario was wrong) — the
              # job="envoy-access" query below never matched real traffic for
              # this scenario in either architecture.
              expr: 'sum by (source_ip) (count_over_time({namespace="financial",app="api-gateway"} | json | event="jwt_verification_failed" [5m])) > 10'
              instant: true
              queryType: instant
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Brute force login — hơn 10 lần 403 từ cùng source_ip trong 5 phút"
          description: "ATT&CK T1110.001 — Kẻ tấn công gửi nhiều request với JWT không hợp lệ. api-gateway's own JWT decode từ chối (401), ghi log event=jwt_verification_failed — request không tới được OPA ext_authz (xác nhận qua test thật)."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Block IP nguồn tấn công (Redis blocklist, 24h TTL)
            2. Revoke session Keycloak của user bị nhắm tới
            3. Ghi case vào /data/cases.jsonl
            🔧 Admin cần xem xét: Grafana → ZTLab → SOAR Cases
        labels:
          severity: high
          category: security
          mitre: T1110.001
          attack_type: brute_force
