apiVersion: 1

groups:
  - orgId: 1
    name: fraud-gate
    folder: ZTLab
    interval: 1m
    rules:
      - uid: fraud-gate-bypass
        title: "Kịch bản 3 — Fraud Gate Bypass (Gap 2)"
        for: 0s
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              datasource:
                type: loki
                uid: Loki
              expr: '{job="opa-decisions",opa_result="false",request_path="/transactions/execute"}'
              instant: false
              queryType: range
              refId: A
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Fraud Gate bypass: payment-service cố thực hiện giao dịch không qua fraud-detection"
          description: "ATT&CK T1078.004 — Gap 2: payment-service gọi core-banking mà thiếu header X-Fraud-Score. OPA từ chối."
          soar_action: |
            ✅ SOAR đã tự động:
            1. Block transaction ID liên quan trong Redis (TTL 1h)
            2. Flag user account vào danh sách review
            3. Tạo case với playbook fraud_response
            🔧 Admin cần xem xét: Grafana → ZTLab → Fraud Gate dashboard
        labels:
          severity: critical
          category: security
          gap: gap2
          mitre: T1078.004
          attack_type: fraud_gate_bypass
