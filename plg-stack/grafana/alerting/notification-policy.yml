apiVersion: 1

contactPoints:
  - orgId: 1
    name: ztlab-security-admin
    receivers:
      # Kênh 1: incident-analyzer — đóng gói bằng chứng + gửi email (KHÔNG thực thi)
      - uid: ztlab-incident-analyzer-webhook
        type: webhook
        settings:
          url: "http://incident-analyzer.plg-stack.svc.cluster.local:8080/grafana-webhook"
          httpMethod: POST
          title: "[ZTLab Incident] {{ .CommonAnnotations.summary }}"
          message: "Severity: {{ .CommonLabels.severity }} | {{ .CommonAnnotations.description }}"
        disableResolveMessage: false
      # Kênh 2: Email cho admin
      - uid: ztlab-admin-email
        type: email
        settings:
          addresses: "soc-admin@ztlab.local"  # tới MailHog plg-stack (GF_SMTP_HOST)
          subject: >-
            [ZTLab SECURITY] {{ .CommonLabels.alertname }} — {{ .CommonLabels.severity | toUpper }}
          message: |
            🚨 CẢNH BÁO BẢO MẬT — ZTLab Zero Trust

            Alert:     {{ .CommonLabels.alertname }}
            Severity:  {{ .CommonLabels.severity | toUpper }}
            MITRE:     {{ .CommonLabels.mitre }}
            Time:      {{ .Alerts.Firing | len }} firing, {{ .Alerts.Resolved | len }} resolved

            ─────────────────────────────────────────
            {{ range .Alerts.Firing }}
            [{{ .StartsAt.Format "15:04:05" }}] {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
            ─────────────────────────────────────────

            ĐỀ XUẤT PHẢN ỨNG (thủ công — hệ thống không tự thực thi):
            {{ .CommonAnnotations.recommended_response }}

            👉 Xem chi tiết: http://127.0.0.1:3000/alerting/list
            👉 Bằng chứng:   http://127.0.0.1:3000/d/ztlab-incident-evidence
        disableResolveMessage: false

  # Kênh riêng cho lỗi hạ tầng bảo mật (SPIRE/OPA down) — CHỈ báo người,
  # KHÔNG qua incident-analyzer webhook. Lý do: lỗi control-plane cần admin
  # vào sửa config/restart, không phải một evidence bundle.
  - orgId: 1
    name: ztlab-infra-admin
    receivers:
      - uid: ztlab-infra-email
        type: email
        settings:
          addresses: "soc-admin@ztlab.local"  # tới MailHog plg-stack (GF_SMTP_HOST)
          subject: >-
            [ZTLab INFRA] {{ .CommonLabels.alertname }} — hạ tầng bảo mật đang lỗi
          message: |
            ⚠️ HẠ TẦNG SECURITY CONTROL-PLANE ĐANG LỖI (không phải bị tấn công)

            Alert:     {{ .CommonLabels.alertname }}
            Component: {{ .CommonLabels.component }}

            ─────────────────────────────────────────
            {{ range .Alerts.Firing }}
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
            ─────────────────────────────────────────

            Hệ thống không tự xử lý — cần admin kiểm tra tay.
            👉 http://127.0.0.1:3000/alerting/list
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ztlab-security-admin
    group_by:
      - grafana_folder
      - alertname
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Lỗi hạ tầng security control-plane (SPIRE/OPA) — chỉ báo người.
      # Đặt trước route category=security để không bị nuốt bởi matcher rộng hơn.
      - receiver: ztlab-infra-admin
        matchers:
          - 'category="infrastructure"'
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 15m
        continue: false
      # Tất cả alert category=security đều vào đây
      # Mục 10 vòng 2026-09-29 (H14): group_interval 5m từng làm bundle lượt 2
      # tới đúng mốc flush 5 phút (Brute Force 79,77 s) — số đo MTTD phản ánh
      # cấu hình thông báo chứ không phải hệ thống. Nay:
      #  - group_by '...' = mỗi alert instance (bộ nhãn) là một nhóm riêng,
      #    rule khác nhau / instance khác nhau không bao giờ gộp vào nhau;
      #  - group_wait 5s, group_interval 30s.
      # Giới hạn còn lại (có chủ đích): rule dùng sum() không nhãn, nên hai lượt
      # cùng kịch bản chỉ tách được khi lượt trước đã về Normal (nhóm bị xoá sau
      # thông báo resolved). tests/collect_metrics.py --runs chờ rule về Normal
      # trước mỗi lượt vì lẽ đó.
      - receiver: ztlab-security-admin
        matchers:
          - 'category="security"'
        group_by: ['...']
        group_wait: 5s
        group_interval: 30s
        repeat_interval: 1h
