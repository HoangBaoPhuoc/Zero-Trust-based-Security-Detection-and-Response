apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      serviceAccountName: default
      containers:
        - name: opa
          image: openpolicyagent/opa:latest
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: opa-config
              mountPath: /etc/opa
              readOnly: true
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: opa-config
          configMap:
            name: opa-config
        - name: opa-policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opa
subjects:
  - kind: ServiceAccount
    name: opa
    namespace: financial
